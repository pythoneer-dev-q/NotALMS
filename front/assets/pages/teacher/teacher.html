<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NotALMS - кабинет учителя</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/static/app.css">
  <script src="/assets/static/toast.js"></script>
  <style>
    :root{--bg:#0b1020;--panel:#111a2e;--surface:#162139;--text:#edf2ff;--muted:#9daac4;--line:#293653;--primary:#6366f1;--danger:#ef4444}
    [data-theme="light"]{--bg:#f5f7fb;--panel:#fff;--surface:#f8faff;--text:#182033;--muted:#65708a;--line:#dce2ee}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Onest,system-ui,sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 22px;color:var(--text);font-weight:800}.brand img{width:38px;height:38px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer}.nav button.active,.nav button:hover{background:var(--surface);color:var(--text)}.side-bottom{margin-top:auto;display:grid;gap:6px}.main{min-width:0;padding:26px 30px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{font-size:1.45rem;margin:0}.top p{margin:4px 0 0;color:var(--muted)}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0;font-size:1.15rem}.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:650}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--danger) 60%,transparent);color:#f87171}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.card h3{margin:0 0 7px;font-size:1.02rem}.muted{color:var(--muted);font-size:.9rem;line-height:1.5}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.tag{padding:5px 9px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:.78rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:11px 12px;border-radius:12px;outline:none}.input:focus{border-color:var(--primary)}textarea.input{min-height:90px;resize:vertical}.form{display:grid;gap:12px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:.78rem;margin:0 0 5px}.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:#050916c7;display:none;align-items:center;justify-content:center;padding:18px;z-index:900}.modal.open{display:flex}.dialog{width:min(620px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.dialog h2{margin:0 0 16px;font-size:1.15rem}.student{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.student:last-child{border:0}.student-main{flex:1;min-width:0}.student strong,.student small{display:block;overflow:hidden;text-overflow:ellipsis}.student small{color:var(--muted);margin-top:3px}.rank{width:34px;text-align:center;color:var(--muted)}.progress-course{padding:13px 0;border-bottom:1px solid var(--line)}.progress-course:last-child{border:0}.bar{height:7px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--primary)}.loading{position:fixed;inset:0;display:none;place-items:center;background:#080d1bd9;z-index:1000}.loading.on{display:grid}.spinner{width:42px;height:42px;border:4px solid #ffffff25;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.mobile-menu{display:none}
    .course-description{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;overflow-wrap:anywhere;min-height:4.05em}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-260px;width:240px;z-index:800;transition:.2s}.side.open{left:0}.main{padding:18px 16px 40px}.mobile-menu{display:inline-flex}.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .btn{width:100%}.top{align-items:flex-start}.actions .btn{flex:1}.dialog{border-radius:14px;padding:16px}}
  </style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><img src="/favicon.ico" alt=""><span>NotALMS</span></div>
    <nav class="nav">
      <button class="active" data-panel="courses"><i class="ti ti-books"></i> Курсы</button>
      <button data-panel="groups"><i class="ti ti-users-group"></i> Учебные группы</button>
      <button data-panel="students"><i class="ti ti-chart-bar"></i> Ученики и прогресс</button>
    </nav>
    <div class="side-bottom">
      <button class="btn ghost" id="theme"><i class="ti ti-sun"></i> тема</button>
      <button class="btn ghost" id="logout"><i class="ti ti-logout"></i> выйти</button>
    </div>
  </aside>
  <main class="main">
    <header class="top"><div><button class="btn ghost mobile-menu" id="menu"><i class="ti ti-menu-2"></i></button><h1>Кабинет учителя</h1><p id="welcome">Загрузка профиля...</p></div></header>
    <section class="panel active" id="panel-courses"><div class="toolbar"><h2>Мои курсы</h2><button class="btn" onclick="openCourse()"><i class="ti ti-plus"></i> создать курс</button></div><div class="grid" id="courses"></div></section>
    <section class="panel" id="panel-groups"><div class="toolbar"><h2>Учебные группы</h2><button class="btn" onclick="openGroup()"><i class="ti ti-plus"></i> создать группу</button></div><div class="grid" id="groups"></div><div class="toolbar" style="margin-top:24px"><h2>Ссылки приглашений</h2></div><div id="group-invites" class="card"></div></section>
    <section class="panel" id="panel-students"><div class="toolbar"><h2>Ученики и прогресс</h2><button class="btn ghost" onclick="loadStudents()"><i class="ti ti-refresh"></i> обновить</button></div><div class="form-row"><select class="input" id="student-group"></select><input class="input" id="student-search" placeholder="Поиск по логину или ID"></div><div class="card" style="margin-top:14px" id="students"></div></section>
  </main>
</div>

<div class="modal" id="course-modal"><div class="dialog"><h2>Новый курс</h2><form class="form" id="course-form"><div class="form-row"><div class="field"><label>ID курса</label><input class="input" id="course-id" required></div><div class="field"><label>Название</label><input class="input" id="course-title" required></div></div><div class="field"><label>Описание, до 500 символов</label><textarea class="input" id="course-description" maxlength="500"></textarea></div><div class="field"><label>Доступен группам</label><div id="course-groups" class="form"></div></div><label class="muted"><input type="checkbox" id="course-published"> опубликовать сразу</label><div class="actions"><button class="btn" type="submit">создать</button><button class="btn ghost" type="button" onclick="closeModal('course-modal')">отмена</button></div></form></div></div>
<div class="modal" id="group-modal"><div class="dialog"><h2 id="group-modal-title">Новая учебная группа</h2><form class="form" id="group-form"><input type="hidden" id="group-id"><div class="field"><label>Название</label><input class="input" id="group-name" required></div><div class="field"><label>Описание</label><textarea class="input" id="group-description"></textarea></div><div class="field"><label>Лимит участников, 0 - без лимита</label><input class="input" id="group-limit" type="number" min="0" value="0"></div><div class="actions"><button class="btn" type="submit">сохранить</button><button class="btn ghost" type="button" onclick="closeModal('group-modal')">отмена</button></div></form></div></div>
<div class="modal" id="invite-modal"><div class="dialog"><h2>Ссылка для учеников</h2><form class="form" id="invite-form"><input type="hidden" id="invite-role"><div class="form-row"><div class="field"><label>Действует, часов</label><input class="input" id="invite-hours" type="number" min="1" max="8760" value="168"></div><div class="field"><label>Число использований</label><input class="input" id="invite-uses" type="number" min="1" max="10000" value="30"></div></div><div class="actions"><button class="btn" type="submit">создать ссылку</button><button class="btn ghost" type="button" onclick="closeModal('invite-modal')">закрыть</button></div><div class="field" id="invite-result" style="display:none"><label>Готовая ссылка</label><div class="form-row"><input class="input" id="invite-url" readonly><button class="btn ghost" type="button" onclick="copyInvite()"><i class="ti ti-copy"></i></button></div></div></form></div></div>
<div class="modal" id="progress-modal"><div class="dialog"><h2 id="progress-title">Прогресс</h2><div id="progress-body"></div><div class="actions"><button class="btn ghost" onclick="closeModal('progress-modal')">закрыть</button></div></div></div>

<script>
const API=(document.querySelector('meta[name="api-base"]')?.content)||`${location.protocol}//${location.hostname}:8443/v1`;
const token=localStorage.getItem('token');let groups=[];let courses=[];let groupInvites=[];let loadingCount=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,method='GET',body){loadingCount++;document.getElementById('loading').classList.add('on');try{const r=await fetch(API+path,{method,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Сессия истекла')}if(r.status===403&&d?.detail?.code==='account_blocked'){location.href='/blocked';throw Error('Аккаунт заблокирован')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error||'Ошибка запроса'));return d}finally{loadingCount--;if(!loadingCount)document.getElementById('loading').classList.remove('on')}}
function notify(message,error=false){window.showToast?showToast(message,error):alert(message)}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+btn.dataset.panel));document.getElementById('side').classList.remove('open');if(btn.dataset.panel==='students')loadStudents()});
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('logout').onclick=()=>{localStorage.removeItem('token');location.href='/'};document.getElementById('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';localStorage.setItem('theme',light?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';
function renderCourses(){const box=document.getElementById('courses');box.innerHTML=courses.length?courses.map(c=>`<article class="card"><h3>${esc(c.title)}</h3><div class="muted course-description">${esc(c.description||'Без описания')}</div><div class="meta"><span class="tag">${c.is_published?'опубликован':'черновик'}</span><span class="tag">групп: ${(c.role_ids||[]).length}</span></div><div class="actions"><a class="btn" href="/teacher/course/${encodeURIComponent(c._id)}/edit"><i class="ti ti-pencil"></i> редактировать</a><a class="btn ghost" href="/course/${encodeURIComponent(c._id)}"><i class="ti ti-player-play"></i></a><button class="btn danger" onclick="deleteCourse('${esc(c._id)}')"><i class="ti ti-trash"></i></button></div></article>`).join(''):'<div class="empty">Курсов пока нет. Создайте первый курс и добавьте в него уроки.</div>'}
function renderGroups(){const box=document.getElementById('groups');box.innerHTML=groups.length?groups.map(g=>`<article class="card"><h3>${esc(g.name)}</h3><div class="muted">${esc(g.description||'Без описания')}</div><div class="meta"><span class="tag">${g.members||0} участников</span><span class="tag">${g.member_limit?`лимит ${g.member_limit}`:'без лимита'}</span></div><div class="muted">ID: ${esc(g._id)}</div><div class="actions"><button class="btn" onclick="openInvite('${esc(g._id)}')"><i class="ti ti-link"></i> пригласить</button><button class="btn ghost" onclick="openGroup('${esc(g._id)}')"><i class="ti ti-settings"></i></button><button class="btn ghost" onclick="openStudents('${esc(g._id)}')"><i class="ti ti-users"></i></button><button class="btn danger" onclick="deleteGroup('${esc(g._id)}')"><i class="ti ti-trash"></i></button></div></article>`).join(''):'<div class="empty">Создайте группу, чтобы приглашать учеников и назначать им курсы.</div>';const select=document.getElementById('student-group');const selected=select.value;select.innerHTML=groups.map(g=>`<option value="${esc(g._id)}">${esc(g.name)}</option>`).join('');if(groups.some(g=>g._id===selected))select.value=selected;renderInvites()}
function renderInvites(){const box=document.getElementById('group-invites');box.innerHTML=groupInvites.length?groupInvites.map(row=>`<div class="student"><div class="student-main"><strong>${row.revoked?'Отозвана':'Активна'}</strong><small>${row.uses}/${row.max_uses} использований · до ${new Date(row.expires_at).toLocaleString('ru')}</small></div>${row.revoked?'':`<button class="btn danger" onclick="revokeInvite('${esc(row._id)}')"><i class="ti ti-link-off"></i></button>`}</div>`).join(''):'<div class="muted">Ссылок пока нет.</div>'}
function openCourse(){document.getElementById('course-form').reset();document.getElementById('course-groups').innerHTML=groups.map(g=>`<label class="card" style="padding:10px"><input type="checkbox" value="${esc(g._id)}"> ${esc(g.name)}</label>`).join('')||'<div class="muted">Сначала создайте учебную группу либо сохраните курс без назначения.</div>';openModal('course-modal')}function openGroup(id=''){document.getElementById('group-form').reset();const group=groups.find(x=>x._id===id);document.getElementById('group-id').value=group?group._id:'';document.getElementById('group-modal-title').textContent=group?'Настройки группы':'Новая учебная группа';if(group){document.getElementById('group-name').value=group.name||'';document.getElementById('group-description').value=group.description||'';document.getElementById('group-limit').value=group.member_limit||0}openModal('group-modal')}function openInvite(id){document.getElementById('invite-role').value=id;document.getElementById('invite-result').style.display='none';openModal('invite-modal')}function openStudents(id){document.getElementById('student-group').value=id;document.querySelector('[data-panel="students"]').click()}
document.getElementById('course-form').onsubmit=async e=>{e.preventDefault();try{const role_ids=Array.from(document.querySelectorAll('#course-groups input:checked')).map(x=>x.value);const c=await api('/teacher/courses','POST',{id:document.getElementById('course-id').value.trim(),title:document.getElementById('course-title').value.trim(),description:document.getElementById('course-description').value.trim(),order:-1,cover:'',is_published:document.getElementById('course-published').checked,difficulty:'easy',tags:[],lessons:[],granted_to:[],role_ids});courses.push(c);renderCourses();closeModal('course-modal');location.href=`/teacher/course/${encodeURIComponent(c._id)}/edit`}catch(e){notify(e.message,true)}};
document.getElementById('group-form').onsubmit=async e=>{e.preventDefault();try{const id=document.getElementById('group-id').value;const body={name:document.getElementById('group-name').value.trim(),description:document.getElementById('group-description').value.trim(),member_limit:Number(document.getElementById('group-limit').value||0)};const g=await api(id?`/teacher/groups/${encodeURIComponent(id)}`:'/teacher/groups',id?'PUT':'POST',body);if(id){const old=groups.find(x=>x._id===id);Object.assign(old,g)}else{g.members=0;groups.unshift(g)}renderGroups();closeModal('group-modal');notify(id?'Группа обновлена':'Группа создана')}catch(e){notify(e.message,true)}};
document.getElementById('invite-form').onsubmit=async e=>{e.preventDefault();try{const d=await api(`/teacher/groups/${encodeURIComponent(document.getElementById('invite-role').value)}/invites`,'POST',{hours:Number(document.getElementById('invite-hours').value),max_uses:Number(document.getElementById('invite-uses').value)});groupInvites.unshift(d);renderInvites();document.getElementById('invite-url').value=`${location.origin}/invite/${d.token}`;document.getElementById('invite-result').style.display='block'}catch(e){notify(e.message,true)}};function copyInvite(){navigator.clipboard.writeText(document.getElementById('invite-url').value);notify('Ссылка скопирована')}async function revokeInvite(id){try{await api(`/teacher/invites/${encodeURIComponent(id)}`,'DELETE');const row=groupInvites.find(x=>x._id===id);if(row)row.revoked=true;renderInvites();notify('Ссылка отозвана')}catch(e){notify(e.message,true)}}
async function deleteCourse(id){if(!confirm('Удалить курс вместе с уроками и заданиями?'))return;try{await api(`/teacher/courses/${encodeURIComponent(id)}`,'DELETE');courses=courses.filter(x=>x._id!==id);renderCourses();notify('Курс удалён')}catch(e){notify(e.message,true)}}async function deleteGroup(id){if(!confirm('Удалить группу? Прогресс её участников по назначенным курсам будет удалён.'))return;try{await api(`/teacher/groups/${encodeURIComponent(id)}`,'DELETE');groups=groups.filter(x=>x._id!==id);renderGroups();notify('Группа удалена')}catch(e){notify(e.message,true)}}
let searchTimer;document.getElementById('student-group').onchange=loadStudents;document.getElementById('student-search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadStudents,250)};
async function loadStudents(){const role=document.getElementById('student-group').value,box=document.getElementById('students');if(!role){box.innerHTML='<div class="empty">Создайте или выберите группу.</div>';return}try{const q=document.getElementById('student-search').value.trim();const rows=await api(`/teacher/groups/${encodeURIComponent(role)}/leaderboard`);const visible=rows.filter(s=>!q||s.user_login?.toLowerCase().includes(q.toLowerCase())||s.user_uid===q);box.innerHTML=visible.length?visible.map(s=>`<div class="student"><div class="rank">${s.position}</div><div class="student-main"><strong>${esc(s.user_login)}</strong><small>${esc(s.user_uid)} · ${s.solved} решено · ${s.course_points} очков</small></div><button class="btn ghost" onclick="showProgress('${esc(role)}','${esc(s.user_uid)}')"><i class="ti ti-chart-dots"></i></button><button class="btn danger" onclick="removeStudent('${esc(role)}','${esc(s.user_uid)}')"><i class="ti ti-user-minus"></i></button></div>`).join(''):'<div class="empty">Ученики не найдены.</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function showProgress(role,uid){try{const d=await api(`/teacher/groups/${encodeURIComponent(role)}/students/${encodeURIComponent(uid)}/progress`);document.getElementById('progress-title').textContent=`Прогресс: ${d.student.user_login}`;document.getElementById('progress-body').innerHTML=d.courses.length?d.courses.map(c=>{const p=c.tasks_total?Math.round(c.solved_tasks.length/c.tasks_total*100):0;const lessons=(c.lesson_details||[]).map(x=>`${x.read?'✓':'○'} ${esc(x.title)}`).join('<br>');const tasks=(c.task_details||[]).map(x=>`${x.status==='solved'?'✓':x.status==='hinted'?'◐':'○'} ${esc(x.title)}`).join('<br>');return `<div class="progress-course"><strong>${esc(c.title)}</strong><div class="muted">Уроки: ${c.read_lessons.length}/${c.lessons_total} · самостоятельно: ${c.solved_tasks.length}/${c.tasks_total} · с подсказкой: ${c.hinted_tasks.length}</div><div class="bar"><span style="width:${p}%"></span></div><div class="form-row" style="margin-top:12px"><div class="muted"><b>Уроки</b><br>${lessons||'нет'}</div><div class="muted"><b>Задания</b><br>${tasks||'нет'}</div></div></div>`}).join(''):'<div class="empty">Для этой группы пока нет назначенных курсов.</div>';openModal('progress-modal')}catch(e){notify(e.message,true)}}async function removeStudent(role,uid){if(!confirm('Удалить ученика из группы и очистить его прогресс по курсам этой группы?'))return;try{await api(`/teacher/groups/${encodeURIComponent(role)}/students/${encodeURIComponent(uid)}`,'DELETE');loadStudents();notify('Ученик удалён из группы')}catch(e){notify(e.message,true)}}
(async()=>{if(!token){location.href='/';return}try{const [me,g,c,i]=await Promise.all([api('/me'),api('/teacher/groups'),api('/teacher/courses'),api('/teacher/invites')]);if(me.account_type!=='teacher'){location.href='/dash';return}document.getElementById('welcome').textContent=me.user_login;groups=g;courses=c;groupInvites=i;renderGroups();renderCourses()}catch(e){notify(e.message,true)}})();
</script>
</body>
</html>
