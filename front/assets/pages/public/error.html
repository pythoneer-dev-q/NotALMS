<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NotALMS - временная ошибка</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root{--bg:#0f172a;--card:#13213d;--text:#e2e8f0;--muted:#94a3b8;--line:rgba(255,255,255,.1);--accent:#818cf8}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Onest,sans-serif}
        main{width:min(100%,560px);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--accent);font-size:1.15rem;font-weight:800}
        .brand img{width:38px;height:38px;object-fit:contain}
        .icon{display:grid;width:52px;height:52px;place-items:center;border-radius:16px;background:rgba(129,140,248,.12);color:var(--accent);font-size:1.6rem}
        h1{margin:18px 0 8px;font-size:1.55rem;letter-spacing:0}
        p{margin:0;color:var(--muted);line-height:1.6}
        .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
        .btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
        .btn.primary{border-color:rgba(129,140,248,.5);background:rgba(99,102,241,.22)}
        @media(max-width:520px){main{padding:24px}.actions .btn{flex:1 1 100%}}
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="/favicon.ico" alt="">NotALMS</div>
        <div class="icon"><i class="ti ti-cloud-off"></i></div>
        <h1>Сервис временно недоступен</h1>
        <p>Не удалось загрузить данные. Попробуй ещё раз через несколько секунд.</p>
        <div class="actions">
            <button class="btn primary" type="button" onclick="location.reload()"><i class="ti ti-refresh"></i>Повторить</button>
            <a class="btn" href="/dash"><i class="ti ti-home"></i>На главную</a>
        </div>
    </main>
</body>
</html>
