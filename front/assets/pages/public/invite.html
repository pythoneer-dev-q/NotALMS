<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приглашение - NotALMS</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"><link rel="stylesheet" href="/assets/static/app.css"><script src="/assets/static/toast.js"></script><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg,#0b1020);color:var(--text,#eef2ff);font-family:Onest,system-ui;padding:18px}.invite{width:min(520px,100%);background:var(--card,#111a2e);border:1px solid var(--line,#293653);border-radius:18px;padding:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:24px}.brand img{width:40px;height:40px}.invite h1{font-size:1.35rem;margin:0 0 10px}.invite p{color:var(--muted,#9daac4);line-height:1.55}.btn{width:100%;padding:12px 16px;border:0;border-radius:12px;background:var(--primary,#6366f1);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}.state{padding:16px 0}
</style></head><body><main class="invite"><div class="brand"><img src="/favicon.ico" alt=""><span>NotALMS</span></div><div class="state" id="state">Проверяем приглашение...</div><button class="btn" id="claim" style="display:none">Принять приглашение</button></main><script>
const API=`${location.protocol}//${location.hostname}:8443/v1`,tokenValue=location.pathname.split('/').filter(Boolean)[1],jwt=localStorage.getItem('token'),state=document.getElementById('state'),button=document.getElementById('claim');let preview;
async function load(){try{const r=await fetch(`${API}/invites/${encodeURIComponent(tokenValue)}`),d=await r.json();if(!r.ok)throw Error(d.detail||'Ссылка недействительна или срок истёк');preview=d;state.innerHTML=`<h1>${d.kind==='teacher'?'Регистрация учителя':`Группа «${String(d.role_name||'').replace(/[<>]/g,'')}»`}</h1><p>${d.kind==='teacher'?'После принятия откроется кабинет учителя.':'Присоединение добавит учебную роль к вашему существующему аккаунту.'}</p>`;button.style.display='block';button.textContent=jwt?'Принять приглашение':'Войти или зарегистрироваться'}catch(e){state.innerHTML=`<h1>Приглашение недоступно</h1><p>${e.message}</p>`}}
button.onclick=async()=>{if(!jwt){localStorage.setItem('pending_invite',tokenValue);location.href='/login';return}button.disabled=true;try{const r=await fetch(`${API}/invites/${encodeURIComponent(tokenValue)}/claim`,{method:'POST',headers:{Authorization:`Bearer ${jwt}`}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Не удалось принять приглашение');localStorage.removeItem('pending_invite');location.href=d.account_type==='teacher'?'/teacher':'/dash'}catch(e){state.innerHTML+=`<p>${e.message}</p>`;button.disabled=false}};load();
</script></body></html>
