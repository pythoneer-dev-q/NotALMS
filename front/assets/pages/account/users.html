<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>NotALMS — Поиск пользователей</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/static/app.css">
    <script>(function(){var theme=localStorage.getItem('theme');if(theme)document.documentElement.dataset.theme=theme;}())</script>
    <script src="/assets/static/toast.js"></script>
    <script src="/assets/static/loader.js"></script>
    <style>
        .search-form{display:flex;gap:10px;max-width:720px}.search-form input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
        .search-hint{margin:10px 0 18px;color:var(--muted);font-size:.9rem}.users-list{display:flex;flex-direction:column;gap:10px;max-width:720px}.user-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:.18s}.user-row:hover{border-color:var(--line2);transform:translateY(-1px)}.user-row__icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(99,102,241,.12);color:var(--primary);font-size:20px}.user-row__body{min-width:0;flex:1}.user-row__name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.verified-badge{color:#38bdf8;margin-left:5px;vertical-align:-2px}.user-row__id{margin-top:3px;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-row__rating{color:var(--accent);font-weight:600;white-space:nowrap}.empty{padding:30px 0;color:var(--muted);text-align:center}@media(max-width:700px){.search-form{flex-direction:column}.search-form .btn{width:auto;align-self:flex-end}.user-row{padding:12px}.user-row__rating{font-size:.85rem}}
    </style>
</head>
<body>
    <div class="menu" id="menu">
        <div class="menu-head"><h3>Меню</h3><button class="menu-close" onclick="closeMenu()" aria-label="Закрыть меню"><i class="ti ti-x"></i></button></div>
        <a class="menu-item" href="/dash"><i class="ti ti-books"></i><span>Курсы</span></a>
        <a class="menu-item" href="/dash#top"><i class="ti ti-trophy"></i><span>Топ учеников</span></a>
        <a class="menu-item active" href="/users"><i class="ti ti-search"></i><span>Поиск</span></a>
        <a class="menu-item" href="/news"><i class="ti ti-news"></i><span>Новости</span></a>
        <a class="menu-item" href="/profile"><i class="ti ti-user-circle"></i><span>Профиль</span></a>
        <a class="menu-item" href="/settings"><i class="ti ti-settings"></i><span>Настройки</span></a>
        <button class="menu-item bottom" onclick="logout()"><i class="ti ti-logout"></i><span>Выйти</span></button>
    </div>
    <div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>
    <header class="header"><div class="burger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></div><a href="/" class="logo">NotALMS</a><a href="/profile" class="user" id="user-name"><span>...</span></a></header>
    <main class="page">
        <h1 class="title">Поиск пользователей</h1>
        <form class="search-form" id="search-form"><input id="query" type="search" autocomplete="off" placeholder="Логин или уникальный ID"><button class="btn btn-primary" type="submit"><i class="ti ti-search"></i> Найти</button></form>
        <div class="search-hint" id="search-hint">Введи минимум 2 символа.</div>
        <div class="users-list" id="users-list"></div>
    </main>
    <script>
        const API_BASE=document.querySelector('meta[name="api-base"]')?.content||`${location.protocol}//${location.hostname}:8443/v1`;
        const token=localStorage.getItem('token'); if(!token)location.href='/login';
        let timer=null;
        function toggleMenu(){document.getElementById('menu').classList.toggle('active');document.getElementById('menu-overlay').classList.toggle('active')}
        function closeMenu(){document.getElementById('menu').classList.remove('active');document.getElementById('menu-overlay').classList.remove('active')}
        function logout(){localStorage.removeItem('token');location.href='/'}
        function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
        async function search(){const q=document.getElementById('query').value.trim(),hint=document.getElementById('search-hint'),box=document.getElementById('users-list');if(q.length<2){hint.textContent='Введи минимум 2 символа.';box.innerHTML='';return}hint.textContent='Ищем…';box.innerHTML='';try{const r=await fetch(`${API_BASE}/users/search?q=${encodeURIComponent(q)}`,{headers:{Authorization:`Bearer ${token}`}});const list=await r.json();if(!r.ok)throw new Error();hint.textContent=list.length?`Найдено: ${list.length}`:'Ничего не найдено.';box.innerHTML=list.map(u=>`<article class="user-row" tabindex="0" role="link" data-uid="${esc(u.user_uid)}"><div class="user-row__icon"><i class="ti ti-user"></i></div><div class="user-row__body"><div class="user-row__name"${u.name_color?` style="color:${esc(u.name_color)}"`:''}>${esc(u.user_login)}${u.verified?'<i class="ti ti-circle-check verified-badge" title="Профиль подтверждён"></i>':''}</div><div class="user-row__id">${esc(u.user_uid)}</div></div><div class="user-row__rating"><i class="ti ti-star"></i> ${u.rating??0}</div></article>`).join('');box.querySelectorAll('.user-row').forEach(el=>{const open=()=>location.href='/user/'+encodeURIComponent(el.dataset.uid);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')open()}})}catch{hint.textContent='Не удалось выполнить поиск.'}}
        document.getElementById('search-form').onsubmit=e=>{e.preventDefault();search()};document.getElementById('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,350)};
        fetch(`${API_BASE}/me`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).then(me=>{const n=document.getElementById('user-name');if(n){n.querySelector('span').textContent=me.user_login||'профиль';if(me.name_color)n.style.color=me.name_color}}).catch(()=>{});
    </script>
</body>
</html>
