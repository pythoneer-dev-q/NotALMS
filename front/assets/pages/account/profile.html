<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotALMS — Профиль</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script src="/assets/static/toast.js"></script>
    <script src="/assets/static/loader.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #13213d;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #fbbf24;
            --line: rgba(255, 255, 255, .08);
            --line2: rgba(255, 255, 255, .14);
            --acc1: #818cf8;
            --r-btn: 18px;
        }

        [data-theme="emerald"] {
            --primary: #10b981;
            --bg: #08130e;
            --card: rgba(14, 50, 38, .85);
            --text: #dcfce7;
            --acc1: #34d399;
        }

        [data-theme="sunset"] {
            --primary: #f59e0b;
            --bg: #171009;
            --card: rgba(60, 42, 14, .85);
            --text: #fef3c7;
            --acc1: #fbbf24;
        }

        [data-theme="rose"] {
            --primary: #f43f5e;
            --bg: #170a12;
            --card: rgba(70, 16, 38, .85);
            --text: #ffe4e6;
            --acc1: #fb7185;
        }

        [data-theme="ocean"] {
            --primary: #0ea5e9;
            --bg: #071224;
            --card: rgba(13, 52, 94, .85);
            --text: #e0f2fe;
            --acc1: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Onest', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== header ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            background: #0a0910;
            border-bottom: 1px solid var(--line);
        }

        .burger {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            color: var(--muted);
            transition: .2s;
        }

        .burger:hover {
            color: var(--text);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--acc1);
            text-decoration: none;
            margin-right: auto;
        }

        /* ===== liquid glass кнопки (как в dash) ===== */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: .1px;
            cursor: pointer;
            padding: 11px 20px;
            border-radius: var(--r-btn);
            border: 1px solid var(--line2);
            color: var(--text);
            background: rgba(255, 255, 255, .04);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
            white-space: nowrap;
            text-decoration: none;
            overflow: hidden;
            transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .09),
                    rgba(255, 255, 255, .02) 45%,
                    transparent 70%);
        }

        .btn>* {
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            border-color: color-mix(in srgb, var(--primary) 55%, var(--line2));
            background: rgba(255, 255, 255, .07);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            color: #fff;
            border-color: color-mix(in srgb, var(--primary) 60%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .btn-primary::before {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .btn-primary:hover {
            border-color: color-mix(in srgb, var(--primary) 80%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 42%, transparent),
                    color-mix(in srgb, var(--primary) 22%, transparent));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .btn-primary .arr {
            transition: transform .18s;
        }

        .btn-primary:hover .arr {
            transform: translateX(3px);
        }

        .btn-lg {
            padding: 14px 26px;
            font-size: 15.5px;
            border-radius: 20px;
        }

        /* чип логина — liquid glass primary */
        .user {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: .1px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: var(--r-btn);
            border: 1px solid color-mix(in srgb, var(--primary) 60%, transparent);
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
            overflow: hidden;
            transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
        }

        .user::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .user>* {
            position: relative;
            z-index: 1;
        }

        .user:hover {
            border-color: color-mix(in srgb, var(--primary) 80%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 42%, transparent),
                    color-mix(in srgb, var(--primary) 22%, transparent));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .user:active {
            transform: translateY(1px);
        }

        /* ===== burger menu ===== */
        .menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #0a0910;
            border-right: 1px solid var(--line);
            transition: .3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .menu.active {
            left: 0;
        }

        .menu-head {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            height: 56px;
            flex: 0 0 auto;
            margin: 0 -16px 8px;
            padding: 0 12px 0 16px;
            background: #0a0910;
            border-bottom: 1px solid var(--line);
        }

        .menu-head h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .menu-close {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--muted);
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: .18s;
        }

        .menu-close:hover {
            background: rgba(255, 255, 255, .08);
            color: var(--text);
            border-color: var(--line2);
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: .95rem;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            transition: .18s;
        }

        .menu-item i {
            font-size: 1.15rem;
            color: var(--primary);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .menu-item>* {
            position: relative;
            z-index: 1;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, .05);
            color: var(--text);
        }

        .menu-item.active {
            border-color: color-mix(in srgb, var(--primary) 60%, transparent);
            color: #fff;
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .menu-item.active::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .menu-item.active i {
            color: #fff;
        }

        .menu-item.bottom {
            margin-top: auto;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 25, .5);
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 90;
        }

        .menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== page ===== */
        .page {
            max-width: 62rem;
            margin: 0 auto;
            padding: 2rem 1.2rem 3rem;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1.3rem;
        }

        .card.wide {
            grid-column: 1 / -1;
        }

        .label {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
        }

        .info {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: .5rem;
        }

        .info .ti {
            margin-right: 4px;
        }

        .bio {
            margin-top: .5rem;
            line-height: 1.55;
            font-size: .95rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .profile-edit-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: .85rem;
            color: var(--acc1);
            font-size: .86rem;
            font-weight: 600;
            text-decoration: none;
        }

        .profile-edit-link:hover { color: var(--text); }

        .uid-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: .6rem;
            flex-wrap: wrap;
        }

        .uid-val {
            font-family: ui-monospace, monospace;
            font-size: .82rem;
            color: var(--muted);
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 10px;
            overflow-wrap: anywhere;
        }

        .uid-copy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: inherit;
            font-size: .78rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--line2);
            background: rgba(255, 255, 255, .04);
            color: var(--text);
        }

        .muted {
            color: var(--muted);
        }

        .ok {
            color: #4ade80;
        }

        .bad {
            color: #f87171;
        }

        .ach-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: .8rem;
        }

        .ach {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: .7rem .9rem;
            border-radius: 10px;
            background: color-mix(in srgb, var(--primary) 12%, transparent);
            border: 1px solid var(--line);
        }

        .ach .ti {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .ach__title {
            font-weight: 600;
            font-size: .88rem;
        }

        .ach__desc {
            font-size: .72rem;
            color: var(--muted);
        }

        .rating-value {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .rating-value .ti {
            color: var(--accent);
        }

        a {
            color: var(--acc1);
        }

        /* ===== нижняя кнопка ===== */
        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: stretch;
        }

        .actions .btn-lg {
            width: 100%;
            justify-content: center;
        }

        /* ===== mobile ===== */
        @media (max-width: 700px) {
            .header {
                padding: 12px 14px;
            }

            .logo {
                font-size: 1.15rem;
            }

            .burger {
                font-size: 1.55rem;
            }

            .user {
                padding: .55rem .95rem;
                font-size: .85rem;
            }

            .page {
                padding: 1.4rem .9rem 2.4rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 1.1rem;
            }

            .menu {
                width: 260px;
                padding: 0 14px 14px;
            }

            .menu-head {
                margin: 0 -14px 8px;
                padding: 0 10px 0 14px;
                height: 50px;
            }

            .menu-item {
                padding: 10px 11px;
                font-size: .9rem;
                border-radius: 12px;
            }

            .btn {
                padding: .55rem .9rem;
                font-size: .88rem;
                border-radius: 14px;
            }

            .btn-lg {
                padding: 12px 20px;
                font-size: .95rem;
                border-radius: 16px;
            }
        }
</style>
<style>.logo{display:inline-flex;align-items:center;line-height:1}.logo::before{content:"";width:34px;height:34px;flex:0 0 34px;margin-right:7px;background:url('/favicon.ico') center/contain no-repeat}</style>
</head>

<body>
    <!-- burger menu -->
    <div class="menu" id="menu">
        <div class="menu-head">
            <h3>Меню</h3>
            <button class="menu-close" onclick="closeMenu()" aria-label="Закрыть меню">
                <i class="ti ti-x"></i>
            </button>
        </div>
        <a class="menu-item" href="/dash"><i class="ti ti-books"></i><span>Курсы</span></a>
        <a class="menu-item" href="/dash#top"><i class="ti ti-trophy"></i><span>Топ учеников</span></a>
        <a class="menu-item" href="/users"><i class="ti ti-search"></i><span>Поиск</span></a>
        <a class="menu-item" href="/news"><i class="ti ti-news"></i><span>Новости</span></a>
        <a class="menu-item active" href="/profile"><i class="ti ti-user-circle"></i><span>Профиль</span></a>
        <a class="menu-item" href="/settings"><i class="ti ti-settings"></i><span>Настройки</span></a>
        <button class="menu-item bottom" onclick="logout()"><i class="ti ti-logout"></i><span>Выйти</span></button>
    </div>
    <div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>

    <div class="header">
        <div class="burger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></div>
        <a href="/" class="logo">NotALMS</a>
        <a href="/settings" class="user" id="user-name"><span>...</span></a>
    </div>

    <div class="page">
        <div class="title">Профиль</div>
        <div id="content">
            <div style="color:var(--muted)">загрузка...</div>
        </div>

        <!-- кнопка в настройки -->
        <div class="actions" id="actions" style="display:none">
            <a class="btn btn-primary btn-lg" href="/settings">
                <i class="ti ti-settings"></i> Настройки профиля
                <svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </a>
        </div>
    </div>

    <script>
        const API_BASE = document.querySelector('meta[name="api-base"]')?.content || `${location.protocol}//${location.hostname}:8443/v1`;
        const token = localStorage.getItem('token');
        if (!token) location.href = '/';

        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
            document.getElementById('menu-overlay').classList.toggle('active');
        }
        function closeMenu() {
            document.getElementById('menu').classList.remove('active');
            document.getElementById('menu-overlay').classList.remove('active');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

        function logout() {
            localStorage.removeItem('token');
            location.href = '/';
        }

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function copyUid(uid) {
            const result = navigator.clipboard?.writeText(uid);
            if (!result) { showToast('копирование недоступно в этом браузере', true); return; }
            result.then(
                () => showToast('id скопирован'),
                () => showToast('не удалось скопировать', true)
            );
        }

        function achListHTML(list) {
            if (!Array.isArray(list) || !list.length) return '<div class="muted">пока нет достижений</div>';
            return '<div class="ach-wrap">' + list.map(a => {
                const title = Object.keys(a)[0] || 'достижение';
                const desc = a[title] || '';
                return `<div class="ach"><i class="ti ti-award"></i><div><div class="ach__title">${esc(title)}</div><div class="ach__desc">${esc(desc)}</div></div></div>`;
            }).join('') + '</div>';
        }

        async function load() {
            showLoader();
            try {
                const res = await fetch(`${API_BASE}/search_user`, { headers: { Authorization: `Bearer ${token}` } });
                const data = await res.json();
                if (!res.ok || data.error) {
                    document.getElementById('content').innerHTML = `<div class="card wide">${esc(data.error || 'не удалось загрузить профиль')}</div>`;
                    return;
                }
                const color = data.name_color ? ` style="color:${data.name_color}"` : '';
                document.body.dataset.theme = data.theme || localStorage.getItem('theme') || 'midnight';
                document.documentElement.dataset.theme = data.theme || localStorage.getItem('theme') || 'midnight';

                const chip = document.getElementById('user-name');
                if (chip) {
                    const label = chip.querySelector('span') || chip;
                    label.textContent = data.user_login;
                    if (data.name_color) chip.style.color = data.name_color;
                }

                document.getElementById('content').innerHTML = `
                <div class="grid">
                    <div class="card">
                        <div class="label">Логин</div>
                        <div class="info"${color}><i class="ti ti-user"></i> ${esc(data.user_login)}</div>
                        <div class="label" style="margin-top:1rem">Статус</div>
                        <div class="info ${data.status ? 'ok' : 'bad'}">${data.status ? '● активен' : '● заблокирован'}</div>
                    </div>
                    <div class="card">
                        <div class="label">О себе</div>
                        <div class="bio">${data.biography ? esc(data.biography) : '<span class="muted">не указано</span>'}</div>
                        <a class="profile-edit-link" href="/settings"><i class="ti ti-pencil"></i> Изменить в настройках</a>
                    </div>
                    <div class="card">
                        <div class="label">Уникальный ID</div>
                        <div class="uid-box">
                            <span class="uid-val">${esc(data.user_uid)}</span>
                            <button class="uid-copy" type="button" onclick="copyUid('${esc(data.user_uid)}')"><i class="ti ti-copy"></i> копировать</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="label">Рейтинг</div>
                        <div class="info"><span class="rating-value" id="p-rating"><i class="ti ti-star"></i> ${data.rating ?? 0}</span></div>
                        <div class="label" style="margin-top:1rem">Решено задач</div>
                        <div class="info" id="p-solved">${data.solved ?? 0}</div>
                    </div>
                    <div class="card">
                        <div class="label">Telegram</div>
                        <div class="info"><i class="ti ti-brand-telegram"></i> ${data.user_telegram_FOR_ANNOUCMENTS ? '<span class="ok">привязан</span>' : '<span class="muted">не привязан</span>'}</div>
                        <div class="bio">привязка и отвязка — в <a href="/settings">настройках</a></div>
                    </div>
                    <div class="card wide">
                        <div class="label">Достижения</div>
                        ${achListHTML(data.achivements)}
                    </div>
                </div>`;

                document.getElementById('actions').style.display = 'flex';
                refreshDynamic();
            } catch {
                document.getElementById('content').innerHTML = '<div class="card wide">ошибка связи с сервером</div>';
            } finally {
                hideLoader();
            }
        }

        async function refreshDynamic() {
            try {
                const pj = await (await fetch(`${API_BASE}/me/progress`, { headers: { Authorization: `Bearer ${token}` } })).json();
                const el = document.getElementById('p-solved');
                if (el) el.innerHTML = `${pj.solved ?? 0} <span class="muted">· #${pj.rating_position ?? '?'} в топе</span>`;
            } catch { }
            try {
                const m = await (await fetch(`${API_BASE}/me`, { headers: { Authorization: `Bearer ${token}` } })).json();
                const r = document.getElementById('p-rating');
                if (r && m.rating != null) r.innerHTML = `<i class="ti ti-star"></i> ${m.rating}`;
            } catch { }
        }

        load();
    </script>
</body>

</html>
