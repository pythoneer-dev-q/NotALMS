<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>NotALMS — Курс</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="../../../favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <script src="/assets/static/toast.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --panel: rgba(20, 40, 70, .95);
      --text: #e2e8f0;
      --accent: #4ade80;
      --error: #ef4444;
      --warning: #facc15;
      --dna-font: 'Fira Code', monospace;
      --bord: color-mix(in srgb, var(--primary) 30%, transparent);
      --bord-soft: color-mix(in srgb, var(--primary) 14%, transparent);
      --line: rgba(255, 255, 255, .06);
      --line2: rgba(255, 255, 255, .12);
      --muted: #94a3b8;
      --surface: #0e0d13;
      --surface2: #131019;
      --r: 14px;
      --r-btn: 18px;
    }

    [data-theme="emerald"] {
      --primary: #10b981;
      --bg: #08130e;
      --panel: rgba(10, 35, 26, .95);
      --text: #dcfce7;
      --accent: #34d399;
    }

    [data-theme="sunset"] {
      --primary: #f59e0b;
      --bg: #171009;
      --panel: rgba(40, 27, 9, .95);
      --text: #fef3c7;
      --accent: #fbbf24;
    }

    [data-theme="rose"] {
      --primary: #f43f5e;
      --bg: #170a12;
      --panel: rgba(45, 12, 26, .95);
      --text: #ffe4e6;
      --accent: #fb7185;
    }

    [data-theme="ocean"] {
      --primary: #0ea5e9;
      --bg: #071224;
      --panel: rgba(9, 34, 64, .95);
      --text: #e0f2fe;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Onest', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 60;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: rgba(5, 5, 8, .85) !important;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: 'Onest', sans-serif !important;
      font-weight: 800 !important;
      font-size: 1.3rem;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 60px);
      min-height: calc(100dvh - 60px);
      width: 100%;
    }

    .lessons-list {
      width: 320px;
      flex-shrink: 0;
      background: rgba(8, 7, 11, .9);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-right: 1px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* ===== Контент: правильное центрирование содержимого ===== */
    .course-content {
      flex: 1;
      min-width: 0;
      padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: calc(100vh - 60px);
      min-height: calc(100dvh - 60px);
      overflow-y: auto;
    }

    #lesson-root,
    .test-container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Центральный плейсхолдер при пустом экране */
    #placeholder-title {
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: .5;
      pointer-events: none;
      max-width: 32rem;
      width: 100%;
      font-size: 1.2rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .sidebar-mobile-head {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -20px -20px 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 7, 11, .95);
      position: sticky;
      top: -20px;
      z-index: 5;
    }

    .sidebar-mobile-head .menu-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .close-sidebar {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: .18s;
    }

    .close-sidebar:hover {
      color: var(--text);
      border-color: var(--line2);
      background: rgba(255, 255, 255, .08);
    }

    .sidebar-section {
      margin-bottom: 25px;
    }

    .sidebar-title {
      color: var(--primary);
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      font-weight: 700;
    }

    .nav-item {
      position: relative;
      padding: 11px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
      font-size: .92rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      background: transparent;
      overflow: hidden;
    }

    .nav-item>* {
      position: relative;
      z-index: 1;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .05);
    }

    .nav-item.active {
      border-color: color-mix(in srgb, var(--primary) 60%, transparent);
      color: #fff;
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 32%, transparent),
          color-mix(in srgb, var(--primary) 18%, transparent));
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .test-badge {
      font-size: .7rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .3);
      font-family: inherit;
    }

    .nav-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .back-to-menu {
      position: sticky;
      bottom: -20px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: auto -20px -20px;
      padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--bord-soft);
      background: rgba(8, 7, 11, .95);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: var(--primary);
      font-size: .9rem;
      cursor: pointer;
      transition: .18s;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-to-menu:hover {
      background: color-mix(in srgb, var(--primary) 15%, transparent);
    }

    .lesson-text {
      margin-bottom: 16px;
      line-height: 1.65;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .lesson-img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 18px 0;
      border: 1px solid #334155;
      background: #0b1220;
    }

    .lesson-list {
      background: rgba(255, 255, 255, .04);
      padding: 16px 20px 16px 36px;
      border-radius: 12px;
      border-left: 3px solid var(--accent);
      margin: 16px 0;
    }

    .lesson-list li {
      margin-bottom: 6px;
      line-height: 1.55;
    }

    .lesson-warning {
      background: rgba(250, 204, 21, .08);
      border-left: 4px solid var(--warning);
      padding: 14px 16px;
      border-radius: 12px;
      color: #fde68a;
      margin: 16px 0;
      font-size: .98rem;
      line-height: 1.5;
    }

    .lesson-warning::before {
      content: "⚠ Внимание";
      display: block;
      font-weight: 700;
      color: var(--warning);
      margin-bottom: 6px;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ===== ВИДЕО: правильные пропорции 16/9 без сжатия и полос ===== */
    .lesson-video,
    .lesson-video-embed {
      position: relative;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      margin: 20px 0;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .lesson-video iframe,
    .lesson-video-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .lesson-video-file {
      display: block;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid #334155;
      margin: 20px 0;
      background: #000;
    }

    .nav-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      font-size: .95rem;
      color: var(--accent);
    }

    .nav-status.hint {
      color: var(--warning);
    }

    .nav-item.done {
      border-left: 3px solid var(--accent);
    }

    .nav-item.hinted {
      border-left: 3px solid var(--warning);
    }

    .locked-note {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent);
      color: var(--warning);
      font-size: .95rem;
      background: rgba(250, 204, 21, .05);
    }

    .mark-read-btn {
      position: relative;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-family: inherit;
      font-size: .8rem;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: .2s;
    }

    .mark-read-btn:hover {
      border-color: var(--primary);
      color: var(--text);
      background: rgba(255, 255, 255, .08);
    }

    .task-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .015);
      border-radius: 20px 20px 0 0;
    }

    .task-kicker {
      display: block;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      opacity: .55;
      margin-bottom: 4px;
    }

    .task-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .task-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .task-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
    }

    .task-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 24px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .015);
      border-radius: 0 0 20px 20px;
    }

    .task-instruction {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--accent);
    }

    .dna-display {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 14px;
      border-left: 4px solid var(--primary);
      background: rgba(0, 0, 0, .32);
      font-family: var(--dna-font);
      font-size: 1.05rem;
    }

    .strand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      color: #94a3b8;
      word-break: break-all;
    }

    .strand .seq {
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .strand .end {
      color: var(--warning);
      font-weight: 600;
    }

    .reward-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 700;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
    }

    .reward-chip.muted {
      border-color: color-mix(in srgb, var(--warning) 45%, transparent);
      background: color-mix(in srgb, var(--warning) 15%, transparent);
      color: var(--warning);
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dna-input {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line2);
      color: var(--text);
      padding: 14px 18px;
      font-family: var(--dna-font);
      font-size: 1.1rem;
      border-radius: 14px;
      letter-spacing: 2px;
      outline: none;
      transition: .2s;
      text-transform: uppercase;
    }

    .dna-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, .07);
    }

    .submit-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 10px 28px;
      border: 1px solid var(--primary);
      border-radius: var(--r-btn);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      transition: .2s;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .bulb-btn {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font: inherit;
      font-size: .82rem;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: .2s;
    }

    .bulb-btn:hover {
      border-color: var(--warning);
      color: var(--warning);
    }

    .bulb-btn.used {
      border-color: var(--warning);
      color: var(--warning);
      opacity: .8;
      cursor: default;
    }

    .feedback-msg {
      min-height: 20px;
      font-size: .9rem;
      line-height: 1.5;
    }

    .feedback-msg.error {
      color: var(--error);
    }

    .feedback-msg.success {
      color: var(--accent);
    }

    /* ===== НОРМАЛЬНАЯ СТРЕЛКА (MENU-TAB) ===== */
    .menu-tab {
      display: none;
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 130;
      width: 32px;
      height: 58px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--bord);
      border-left: none;
      border-radius: 0 16px 16px 0;
      background: rgba(14, 20, 36, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.4);
      color: var(--text);
      cursor: pointer;
      padding: 0;
      transition: transform .22s cubic-bezier(0.2, 0.8, 0.2, 1), background .2s, border-color .2s;
    }

    .menu-tab svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .25s ease;
      display: block;
    }

    .menu-tab:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .menu-tab.open svg {
      transform: rotate(180deg);
    }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 118;
    }

    .menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== МОБИЛЬНАЯ АДАПТИВНОСТЬ ===== */
    @media (max-width: 860px) {
      .menu-tab {
        display: flex;
      }

      .menu-overlay {
        display: block;
      }

      .lessons-list {
        position: fixed;
        top: 60px;
        left: 0;
        bottom: 0;
        width: 85%;
        max-width: 340px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
        transform: translateX(-105%);
        transition: transform .26s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 120;
        box-shadow: 16px 0 40px rgba(0, 0, 0, 0.7);
      }

      .lessons-list.open {
        transform: translateX(0);
      }

      .sidebar-mobile-head {
        display: flex;
      }

      /* Ровное центрирование контента без сбивающих смещений */
      .course-content {
        padding: 20px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
        width: 100%;
      }

      .task-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .task-head-right {
        width: 100%;
        justify-content: flex-start;
      }

      .task-foot {
        flex-direction: column;
        align-items: stretch;
      }

      .task-foot .submit-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <header class="header">
    <a href="/" class="logo">NotALMS</a>
  </header>

  <!-- Качественная центрированная кнопка вызова меню со стрелкой -->
  <button class="menu-tab" id="menu-tab" aria-label="Открыть меню курсов">
    <svg viewBox="0 0 24 24">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <div class="menu-overlay" id="menu-overlay"></div>

  <div class="container">
    <aside class="lessons-list" id="sidebar">
      <div class="sidebar-mobile-head">
        <span class="menu-title">Содержание курса</span>
        <button class="close-sidebar" id="close-sidebar" aria-label="Закрыть меню">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Теория</div>
        <div id="lessons-container"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Практика</div>
        <div id="tests-container"></div>
      </div>
      <a href="/dash" class="back-to-menu"><i class="ti ti-arrow-left"></i> Назад в панель</a>
    </aside>

    <main class="course-content" id="main-area">
      <h2 id="placeholder-title">Выберите урок или тест из списка слева</h2>
    </main>
  </div>

  <script>
    const API_BASE = document.querySelector('meta[name="api-base"]')?.content || `${location.protocol}//${location.hostname}:8443/v1`;
    const token = localStorage.getItem('token') || '';
    if (!token) location.href = '/login';
    const courseID = location.pathname.split('/').pop();
    let currentTaskId = null;
    let currentTaskDefId = null;
    let currentTaskTitle = '';
    let attemptCounter = 0;

    function getLoaderHtml(customClass = '') {
      return `
      <div class="loader-box ${customClass}" style="display:flex;justify-content:center;padding:24px;">
        <svg class="loader-svg" style="width:40px;height:40px;fill:var(--primary);" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/>
          <path d="M10.72,19.9a8,8,0,0,1-6.5-9.79A7.77,7.77,0,0,1,10.4,4.16a8,8,0,0,1,9.49,6.52A1.54,1.54,0,0,0,21.38,12h.13a1.37,1.37,0,0,0,1.38-1.54,11,11,0,1,0-12.7,12.39A1.54,1.54,0,0,0,12,21.34h0A1.47,1.47,0,0,0,10.72,19.9Z">
            <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12" repeatCount="indefinite"/>
          </path>
        </svg>
      </div>`;
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      try {
        const opts = { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_BASE + endpoint, opts);
        if (res.status === 401) { location.href = '/login'; return null; }
        return await res.json().catch(() => null);
      } catch (e) { console.error('network error', e); return null; }
    }

    let readLessons = new Set();
    let solvedTasks = new Set();
    let hintedTasks = new Set();
    let currentLessonId = null;
    let readSent = false;

    async function init() {
      const lContainer = document.getElementById('lessons-container');
      lContainer.innerHTML = getLoaderHtml();
      const lessons = await apiRequest(`/search_lessons/${courseID}`);
      lContainer.innerHTML = '';
      const [reads, solved] = await Promise.all([
        apiRequest(`/me/reads/${courseID}`),
        apiRequest('/me/solved')
      ]);
      readLessons = new Set(reads?.read || []);
      solvedTasks = new Set((solved?.solved || []).map(String));
      hintedTasks = new Set((solved?.hinted || []).map(String));
      if (lessons && Array.isArray(lessons)) renderSidebar(lessons);
    }

    function statusHtml(isRead, isSolved, isHinted) {
      if (isSolved) return `<span class="nav-status"><i class="ti ti-circle-check"></i></span>`;
      if (isHinted) return `<span class="nav-status hint"><i class="ti ti-bulb"></i></span>`;
      if (isRead) return `<span class="nav-status"><i class="ti ti-eye"></i></span>`;
      return '';
    }

    function renderSidebar(lessons) {
      const lContainer = document.getElementById('lessons-container');
      const tContainer = document.getElementById('tests-container');
      lContainer.innerHTML = '';
      tContainer.innerHTML = '';
      lessons.forEach(lesson => {
        if (lesson.type === 'theory' || !lesson.type) {
          const isRead = readLessons.has(lesson._id);
          const el = document.createElement('div');
          el.className = 'nav-item' + (isRead ? ' done' : '');
          el.dataset.lessonId = lesson._id;
          el.innerHTML = `<span class="nav-title">${escapeHtml(lesson.title || 'без названия')}</span>${statusHtml(isRead, false, false)}`;
          el.onclick = () => { loadLesson(lesson); closeSidebar(); };
          lContainer.appendChild(el);
        }
        loadTasksForLesson(lesson._id, tContainer);
      });
    }

    async function loadTasksForLesson(lessonID, container) {
      const tasks = await apiRequest(`/gettasks/${lessonID}`);
      if (!tasks) return;
      tasks.forEach(task => {
        const isSolved = solvedTasks.has(String(task._id));
        const isHinted = hintedTasks.has(String(task._id));
        const el = document.createElement('div');
        el.className = 'nav-item' + (isSolved ? ' done' : (isHinted ? ' hinted' : ''));
        el.dataset.taskId = task._id;
        el.innerHTML = `<span class="nav-title">${escapeHtml(task.title || 'Тест')}</span><span class="test-badge">${escapeHtml(task.mode || 'N')}</span>${statusHtml(false, isSolved, isHinted)}`;
        el.onclick = () => { currentTaskTitle = task.title || ''; currentTaskDefId = task._id; loadTestInterface(task._id); closeSidebar(); };
        container.appendChild(el);
      });
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function safeUrl(u) {
      if (!u) return '';
      let s = String(u).trim();
      if (/^\s*javascript:/i.test(s)) return '';
      return s.replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    /* ===== Нормализация всех типов видео (YouTube, Rutube, VK) ===== */
    function videoEmbedUrl(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.replace(/^www\./, '');
        if (host === 'youtu.be') return `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
        if (host.endsWith('youtube.com')) {
          if (u.pathname.startsWith('/watch')) return `https://www.youtube.com/embed/${u.searchParams.get('v') || ''}`;
          if (u.pathname.startsWith('/shorts/')) return `https://www.youtube.com/embed/${u.pathname.split('/')[2]}`;
          if (u.pathname.startsWith('/embed/')) return url;
        }
        if (host.endsWith('vk.com') || host.endsWith('vkvideo.ru')) {
          const m = u.pathname.match(/\/video(-?\d+)_(\d+)/);
          if (m) return `https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}`;
        }
        if (host.endsWith('rutube.ru')) {
          const m = u.pathname.match(/\/video\/([a-z0-9]+)/i);
          if (m) return `https://rutube.ru/play/embed/${m[1]}`;
        }
        return null;
      } catch (e) { return null; }
    }

    function renderVideo(block) {
      if (block && block.embed) {
        if (block.embed_type === 'script') {
          return `<div class="lesson-video-embed" data-embed-script="${escapeHtml(block.embed)}"></div>`;
        }
        return `<div class="lesson-video"><iframe src="${safeUrl(block.embed)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      const url = block && (block.url || block.src);
      if (!url) return `<div class="lesson-warning">Видео не указано</div>`;
      const embed = videoEmbedUrl(url);
      if (embed) {
        return `<div class="lesson-video"><iframe src="${safeUrl(embed)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      return `<video class="lesson-video-file" controls src="${safeUrl(url)}"></video>`;
    }

    function loadLesson(lesson) {
      const main = document.getElementById('main-area');
      currentLessonId = lesson._id;
      let contentHtml = '';
      if (Array.isArray(lesson.content)) {
        lesson.content.forEach(block => {
          switch (block.type) {
            case 'text':
              contentHtml += `<div class="lesson-text">${escapeHtml(block.value || '')}</div>`;
              break;
            case 'image':
              contentHtml += `<img class="lesson-img" src="${safeUrl(block.src || block.url)}" alt="${escapeHtml(block.alt || '')}" loading="lazy" />`;
              break;
            case 'video':
              contentHtml += renderVideo(block);
              break;
            case 'list':
              if (Array.isArray(block.items)) {
                contentHtml += `<ul class="lesson-list">` + block.items.map(i => `<li>${escapeHtml(i)}</li>`).join('') + `</ul>`;
              }
              break;
            case 'warning':
              contentHtml += `<div class="lesson-warning">${escapeHtml(block.value || '')}</div>`;
              break;
          }
        });
      }

      main.innerHTML = `<div id="lesson-root">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap;">
          <h1 style="margin:0;font-size:1.6rem;font-weight:800;">${escapeHtml(lesson.title || '')}</h1>
          <button id="mark-read-btn" class="mark-read-btn"><i class="ti ti-check"></i> Прочитано</button>
        </div>
        ${contentHtml}
      </div>`;

      main.scrollTop = 0;
    }

    async function loadTestInterface(taskId) {
      const main = document.getElementById('main-area');
      main.innerHTML = getLoaderHtml();
      const task = await apiRequest(`/getTest/${taskId}`);
      if (!task || task.error) {
        main.innerHTML = `<div class="test-container"><div class="locked-note"><i class="ti ti-lock"></i> ${escapeHtml(task?.error || 'Задание недоступно')}</div></div>`;
        return;
      }
      currentTaskId = task.task_id;
      const condition = task.condition || {};

      main.innerHTML = `
      <div class="test-container">
        <div class="task-card">
          <div class="task-head">
            <div>
              <span class="task-kicker">Практическое задание</span>
              <h3 class="task-title">${escapeHtml(currentTaskTitle || 'Задание')}</h3>
            </div>
            <div class="task-head-right">
              <span class="reward-chip"><i class="ti ti-star"></i> +${task.next_reward || 100}</span>
              <button class="bulb-btn" id="bulb-btn"><i class="ti ti-bulb"></i> Подсказка</button>
            </div>
          </div>
          <div class="task-body">
            <p class="task-instruction">${escapeHtml(condition.instruction || 'Постройте цепь согласно условиям:')}</p>
            <div class="dna-display">
              ${condition.top ? `<div class="strand"><span class="seq">${escapeHtml(condition.top)}</span></div>` : ''}
              ${condition.bottom ? `<div class="strand"><span class="seq">${escapeHtml(condition.bottom)}</span></div>` : ''}
            </div>
            <div class="input-area">
              <input type="text" id="user-input" class="dna-input" placeholder="5'-...-3'" autocomplete="off">
              <div id="feedback" class="feedback-msg"></div>
            </div>
          </div>
          <div class="task-foot">
            <span id="attempts" style="opacity:0.6;font-size:0.85rem;">Попыток: ${attemptCounter}</span>
            <button class="submit-btn" onclick="submitAnswer()">Проверить ответ</button>
          </div>
        </div>
      </div>`;
    }

    async function submitAnswer() {
      const input = document.getElementById('user-input');
      const val = input?.value.trim().toUpperCase();
      if (!val) return;
      const res = await apiRequest('/check_answer', 'POST', { task_id: currentTaskId, user_input: val });
      const fb = document.getElementById('feedback');
      if (res && res.is_correct) {
        fb.className = 'feedback-msg success';
        fb.textContent = 'Верно! Задание решено.';
      } else {
        attemptCounter++;
        document.getElementById('attempts').textContent = `Попыток: ${attemptCounter}`;
        fb.className = 'feedback-msg error';
        fb.textContent = 'Неверно, проверьте комплементарность и направление цепи.';
      }
    }

    /* Логика бокового меню */
    const menuTab = document.getElementById('menu-tab');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('menu-overlay');
    const closeBtn = document.getElementById('close-sidebar');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      menuTab.classList.add('open');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      menuTab.classList.remove('open');
    }

    menuTab.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) closeSidebar();
      else openSidebar();
    });

    overlay.addEventListener('click', closeSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);

    // Синхронизация темы
    (async () => {
      try {
        const r = await fetch(`${API_BASE}/search_user`, { headers: { 'Authorization': `Bearer ${token}` } });
        const u = await r.json();
        if (u && u.theme) {
          document.documentElement.dataset.theme = u.theme;
          localStorage.setItem('theme', u.theme);
        }
      } catch (e) { }
    })();

    init();
  </script>
</body>
