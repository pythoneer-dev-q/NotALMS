<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>NotALMS — Курс</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="../../../favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme) document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="/assets/static/toast.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --panel: rgba(20, 40, 70, .95);
      --text: #e2e8f0;
      --accent: #4ade80;
      --error: #ef4444;
      --warning: #facc15;
      --dna-font: 'Fira Code', monospace;
      --bord: color-mix(in srgb, var(--primary) 30%, transparent);
      --bord-soft: color-mix(in srgb, var(--primary) 14%, transparent);
      --line: rgba(255, 255, 255, .06);
      --line2: rgba(255, 255, 255, .12);
      --muted: #94a3b8;
      --surface: #0e0d13;
      --surface2: #131019;
      --r: 14px;
      --r-btn: 18px;
    }

    [data-theme="emerald"] {
      --primary: #10b981;
      --bg: #08130e;
      --panel: rgba(10, 35, 26, .95);
      --text: #dcfce7;
      --accent: #34d399
    }

    [data-theme="sunset"] {
      --primary: #f59e0b;
      --bg: #171009;
      --panel: rgba(40, 27, 9, .95);
      --text: #fef3c7;
      --accent: #fbbf24
    }

    [data-theme="rose"] {
      --primary: #f43f5e;
      --bg: #170a12;
      --panel: rgba(45, 12, 26, .95);
      --text: #ffe4e6;
      --accent: #fb7185
    }

    [data-theme="ocean"] {
      --primary: #0ea5e9;
      --bg: #071224;
      --panel: rgba(9, 34, 64, .95);
      --text: #e0f2fe;
      --accent: #38bdf8
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: 'Onest', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 60;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: rgba(5, 5, 8, .85) !important;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: 'Onest', sans-serif !important;
      font-weight: 800 !important;
      font-size: 1.3rem;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 60px);
      min-height: calc(100dvh - 60px)
    }

    .lessons-list {
      width: 300px;
      flex-shrink: 0;
      background: rgba(8, 7, 11, .9);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-right: 1px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      order: 1;
    }

    .course-content {
      position: relative;
      flex: 1;
      min-width: 0;
      padding: 40px;
      order: 2
    }

    /* ===== центральный плейсхолдер «Выберите урок или тест» ===== */
    #placeholder-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      text-align: center;
      opacity: .5;
      pointer-events: none;
      max-width: 80%;
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .sidebar-mobile-head {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -20px -20px 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 7, 11, .95);
      position: sticky;
      top: -20px;
      z-index: 5;
    }

    .sidebar-mobile-head .menu-title {
      font-weight: 700;
      font-size: 1rem
    }

    .close-sidebar {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: .18s;
    }

    .close-sidebar:hover {
      color: var(--text);
      border-color: var(--line2);
      background: rgba(255, 255, 255, .08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .sidebar-section {
      margin-bottom: 25px
    }

    .sidebar-title {
      color: var(--primary);
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 5px;
      font-weight: 600
    }

    .nav-item {
      position: relative;
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
      font-size: .95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      background: transparent;
      overflow: hidden;
    }

    .nav-item>* {
      position: relative;
      z-index: 1
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .05)
    }

    .nav-item.active {
      border-color: color-mix(in srgb, var(--primary) 60%, transparent);
      color: #fff;
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 32%, transparent),
          color-mix(in srgb, var(--primary) 18%, transparent));
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, .18),
          rgba(255, 255, 255, .04) 45%,
          transparent 70%);
    }

    .test-badge {
      font-size: .7rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .3);
      font-family: inherit
    }

    .nav-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .back-to-menu {
      position: sticky;
      bottom: -20px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 16px -20px -20px;
      padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--bord-soft);
      background: rgba(8, 7, 11, .95);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: var(--primary);
      font-size: .9rem;
      cursor: pointer;
      transition: .18s;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-to-menu:hover {
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 22%, transparent),
          color-mix(in srgb, var(--primary) 10%, transparent));
      border-top-color: color-mix(in srgb, var(--primary) 45%, transparent);
    }

    .lesson-text {
      margin-bottom: 15px;
      line-height: 1.6
    }

    .lesson-img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 15px 0;
      border: 1px solid #334155;
      background: #0b1220;
    }

    .lesson-list {
      background: rgba(255, 255, 255, .04);
      padding: 15px 15px 15px 35px;
      border-radius: 12px;
      border-left: 3px solid var(--accent)
    }

    .lesson-list li {
      margin-bottom: 6px
    }

    .lesson-warning {
      background: rgba(250, 204, 21, .08);
      border-left: 5px solid var(--warning);
      padding: 14px 16px;
      border-radius: 12px;
      color: #fde68a;
      margin: 14px 0;
      font-size: .98rem;
      line-height: 1.5;
      box-shadow: 0 0 18px rgba(250, 204, 21, .04);
    }

    .lesson-warning::before {
      content: "⚠ Внимание";
      display: block;
      font-weight: 700;
      color: var(--warning);
      margin-bottom: 8px;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .lesson-video {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding-top: 56.25%;
      margin: 18px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #0b1220
    }

    .lesson-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0
    }

    .lesson-video-file {
      display: block;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin: 18px 0;
      background: #0b1220
    }

    .lesson-video-embed {
      position: relative;
      width: 100%;
      max-width: 900px;
      min-height: 320px;
      margin: 18px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #0b1220
    }

    .lesson-video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0
    }

    .nav-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      font-size: .95rem;
      color: var(--accent)
    }

    .nav-status .ti {
      font-size: 1rem
    }

    .nav-item.locked {
      opacity: .5
    }

    .nav-item.done .nav-title {
      opacity: .75
    }

    .locked-note {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent);
      color: var(--warning);
      font-size: .92rem
    }

    .nav-status.hint {
      color: var(--warning);
    }

    .nav-item.done {
      border-left: 2px solid var(--accent);
    }

    .nav-item.hinted {
      border-left: 2px solid var(--warning);
    }

    .mark-read-btn {
      position: relative;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-family: inherit;
      font-size: .78rem;
      padding: 7px 12px;
      cursor: pointer;
      overflow: hidden;
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: transform .12s, border-color .2s, background .2s, box-shadow .2s, color .2s;
    }

    .mark-read-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, .09),
          rgba(255, 255, 255, .02) 45%,
          transparent 70%);
    }

    .mark-read-btn:hover {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--line));
      color: var(--text);
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .mark-read-btn:active {
      transform: translateY(1px)
    }

    .test-container {
      max-width: 860px;
      margin: 0 auto;
      animation: fadeIn .4s ease
    }

    .task-card {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: visible;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
    }

    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .015);
      border-radius: 18px 18px 0 0;
    }

    .task-kicker {
      display: block;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      opacity: .55;
      margin-bottom: 4px
    }

    .task-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700
    }

    .task-head-right {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .task-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 22px
    }

    .task-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .015);
      flex-wrap: wrap;
      border-radius: 0 0 18px 18px;
    }

    .attempts {
      font-size: .8rem;
      opacity: .6
    }

    .task-id {
      font-family: ui-monospace, monospace;
      font-size: .75rem;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, .25);
      color: #cbd5e1;
      white-space: nowrap
    }

    .field-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      opacity: .55
    }

    .task-instruction {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--accent)
    }

    .dna-display {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      background: rgba(0, 0, 0, .28);
      font-family: ui-monospace, monospace;
      font-size: 1rem
    }

    .strand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      color: #94a3b8;
      overflow-wrap: anywhere
    }

    .strand .seq {
      color: #e2e8f0;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all
    }

    .strand .end {
      color: var(--warning);
      font-weight: 600;
      font-size: .95rem
    }

    .reward-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--accent) 20%, transparent),
          color-mix(in srgb, var(--accent) 8%, transparent));
      color: var(--accent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14);
      cursor: help;
      white-space: nowrap;
    }

    .reward-chip .ti {
      font-size: 1rem;
    }

    .reward-chip b {
      font-weight: 800;
    }

    .reward-chip .reward-mult {
      padding: 1px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .35);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: inherit;
      opacity: .9;
    }

    .reward-chip.muted {
      border-color: color-mix(in srgb, var(--warning) 45%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--warning) 18%, transparent),
          color-mix(in srgb, var(--warning) 6%, transparent));
      color: var(--warning);
    }

    .hint-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 260px;
      padding: 14px;
      border-radius: 14px;
      background: var(--surface2);
      border: 1px solid var(--line2);
      box-shadow: 0 24px 46px -22px #000c;
      -webkit-backdrop-filter: blur(16px) saturate(1.5);
      backdrop-filter: blur(16px) saturate(1.5);
      z-index: 20;
      animation: fadeIn .18s ease;
    }

    .hint-popover::before {
      content: "";
      position: absolute;
      top: -6px;
      right: 22px;
      width: 10px;
      height: 10px;
      background: var(--surface2);
      border-left: 1px solid var(--line2);
      border-top: 1px solid var(--line2);
      transform: rotate(45deg);
    }

    .hint-popover__title {
      font-size: .9rem;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .hint-popover__text {
      font-size: .82rem;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .hint-popover__actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .hint-popover__actions button {
      font-family: inherit;
      font-size: .8rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .04);
      color: var(--text);
      transition: .15s;
    }

    .hint-popover__actions button:hover {
      background: rgba(255, 255, 255, .08);
      border-color: var(--line2);
    }

    .hint-popover__actions button.primary {
      border-color: color-mix(in srgb, var(--warning) 55%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--warning) 25%, transparent),
          color-mix(in srgb, var(--warning) 12%, transparent));
      color: var(--warning);
    }

    .hint-popover__actions button.primary:hover {
      border-color: color-mix(in srgb, var(--warning) 80%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--warning) 35%, transparent),
          color-mix(in srgb, var(--warning) 18%, transparent));
    }

    .input-area {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dna-input {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 14px 18px;
      font-family: 'Onest', sans-serif;
      font-size: 1.05rem;
      border-radius: 14px;
      letter-spacing: 2px;
      outline: none;
      transition: .2s;
      text-transform: uppercase;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .dna-input::placeholder {
      color: #64748b;
      letter-spacing: 0
    }

    .dna-input:focus {
      border-color: color-mix(in srgb, var(--primary) 55%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
    }

    .dna-input.error {
      border-color: var(--error);
      animation: shake .4s
    }

    .dna-input.success {
      border-color: var(--accent)
    }

    .submit-btn {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      margin: 0;
      padding: 11px 26px;
      border: 1px solid color-mix(in srgb, var(--primary) 60%, transparent);
      border-radius: var(--r-btn);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 32%, transparent),
          color-mix(in srgb, var(--primary) 18%, transparent));
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, .18),
          rgba(255, 255, 255, .04) 45%,
          transparent 70%);
    }

    .submit-btn>* {
      position: relative;
      z-index: 1
    }

    .submit-btn:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--primary) 80%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 42%, transparent),
          color-mix(in srgb, var(--primary) 22%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(1px)
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    .bulb-btn {
      position: relative;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font: inherit;
      font-size: .8rem;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: transform .12s, border-color .2s, background .2s, box-shadow .2s, color .2s;
    }

    .bulb-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, .09),
          rgba(255, 255, 255, .02) 45%,
          transparent 70%);
    }

    .bulb-btn>* {
      position: relative;
      z-index: 1;
    }

    .bulb-btn:hover {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--line));
      color: var(--text);
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .bulb-btn:active {
      transform: translateY(1px)
    }

    .bulb-btn.visible {
      border-color: color-mix(in srgb, var(--warning) 60%, transparent);
      color: var(--warning);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--warning) 20%, transparent),
          color-mix(in srgb, var(--warning) 8%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .bulb-btn.used {
      border-color: color-mix(in srgb, var(--warning) 55%, transparent);
      color: var(--warning);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--warning) 18%, transparent),
          color-mix(in srgb, var(--warning) 6%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14);
      cursor: default;
      opacity: .9;
    }

    .feedback-msg {
      min-height: 20px;
      font-size: .88rem;
      line-height: 1.5
    }

    .feedback-msg .err-line {
      font-family: ui-monospace, monospace;
      font-size: .85rem;
      opacity: .9
    }

    .feedback-msg.error {
      color: var(--error)
    }

    .feedback-msg.success {
      color: var(--accent)
    }

    .loader-box {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      height: 100%
    }

    .loader-svg {
      width: 50px;
      height: 50px;
      fill: var(--primary)
    }

    .btn-loader {
      width: 24px;
      height: 24px;
      fill: #fff
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-5px)
      }

      75% {
        transform: translateX(5px)
      }
    }

    /* ===== menu-tab: очень прозрачная, компактная ===== */
    .menu-tab {
      display: none;
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 130;
      width: 30px;
      height: 52px;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
      border-left: 0;
      border-radius: 0 14px 14px 0;
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      overflow: hidden;
      opacity: .28;
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 22%, transparent),
          color-mix(in srgb, var(--primary) 12%, transparent));
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
      transition: transform .2s, opacity .2s, background .2s, border-color .2s, box-shadow .2s;
    }

    .menu-tab::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, .12),
          rgba(255, 255, 255, .02) 45%,
          transparent 70%);
    }

    .menu-tab i {
      position: relative;
      z-index: 1;
      transition: transform .25s ease
    }

    .menu-tab:hover,
    .menu-tab:focus-visible,
    .menu-tab.open {
      opacity: 1;
    }

    .menu-tab:hover {
      border-color: color-mix(in srgb, var(--primary) 80%, transparent);
      background: linear-gradient(180deg,
          color-mix(in srgb, var(--primary) 42%, transparent),
          color-mix(in srgb, var(--primary) 22%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .menu-tab:active {
      transform: translateY(-50%) scale(.96)
    }

    .menu-tab.open i {
      transform: rotate(180deg)
    }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 25, .55);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 118;
    }

    .menu-overlay.active {
      opacity: 1;
      pointer-events: auto
    }

    @media (max-width:800px) {
      body {
        overflow-y: auto
      }

      .container {
        flex-direction: column;
        min-height: 0
      }

      /* отступ слева = плашка (30) + 16 + буфер = 52px, чтобы не перекрывала */
      .course-content {
        padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) 52px;
        order: 1;
        flex: 1;
        min-width: 0
      }

      .lessons-list {
        position: fixed;
        top: 60px;
        left: 0;
        right: auto;
        width: 85%;
        max-width: 340px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
        transform: translateX(-110%);
        transition: transform .28s ease;
        z-index: 120;
        box-shadow: 24px 0 60px rgba(0, 0, 0, .6);
        order: unset;
        padding: 16px;
        border-right: 1px solid var(--line);
        border-left: 0;
      }

      .lessons-list.open {
        transform: translateX(0)
      }

      .sidebar-mobile-head {
        display: flex;
        margin: -16px -16px 12px;
        padding: 10px 12px
      }

      .back-to-menu {
        margin: 14px -16px -16px;
        padding: 14px 12px calc(14px + env(safe-area-inset-bottom))
      }

      .menu-tab {
        display: flex
      }

      .menu-overlay {
        display: block
      }

      .task-head {
        padding: 12px 14px;
        flex-wrap: wrap
      }

      .task-head-right {
        width: 100%;
        justify-content: flex-start;
      }

      .task-body {
        padding: 14px
      }

      .task-foot {
        padding: 12px 14px
      }

      .task-foot .submit-btn {
        width: 100%
      }

      .dna-display {
        padding: 14px;
        font-size: .9rem
      }

      .dna-input {
        padding: 12px 14px;
        font-size: .95rem;
        letter-spacing: 1px;
        border-radius: 12px
      }

      .lesson-video {
        max-width: 100%
      }

      .header {
        padding: 0 12px
      }

      .logo {
        font-size: 1.15rem !important
      }

      .hint-popover {
        right: auto;
        left: 0;
        width: min(280px, calc(100vw - 60px));
      }

      .hint-popover::before {
        right: auto;
        left: 22px;
      }
    }

    @media (max-width:480px) {
      .lessons-list {
        width: 92%;
        max-width: none
      }

      /* плашка 26 + 12 + 4 = 42px */
      .course-content {
        padding: 12px 12px calc(20px + env(safe-area-inset-bottom)) 44px
      }

      .task-head {
        padding: 10px 12px
      }

      .task-body {
        padding: 12px
      }

      .task-foot {
        padding: 10px 12px
      }

      .task-title {
        font-size: .95rem
      }

      .task-instruction {
        font-size: .95rem
      }

      .dna-display {
        padding: 12px;
        font-size: .85rem
      }

      .dna-input {
        padding: 10px 12px;
        font-size: .9rem;
        letter-spacing: 1px
      }

      .submit-btn {
        padding: 10px 20px;
        font-size: .9rem;
        border-radius: 14px
      }

      .bulb-btn {
        padding: 6px 10px;
        font-size: .75rem
      }

      .reward-chip {
        padding: 5px 10px;
        font-size: .78rem;
      }

      .lesson-text {
        font-size: .95rem
      }

      .lesson-list {
        padding: 12px 12px 12px 28px
      }

      .lesson-list li {
        font-size: .9rem
      }

      .lesson-warning {
        padding: 12px;
        font-size: .9rem
      }

      .sidebar-title {
        font-size: .8rem;
        padding-bottom: 4px
      }

      .nav-item {
        padding: 10px 12px;
        font-size: .9rem;
        border-radius: 12px
      }

      .test-badge {
        font-size: .65rem;
        padding: 2px 5px
      }

      .back-to-menu {
        padding: 10px 12px;
        font-size: .85rem
      }

      /* компактнее на самых узких */
      .menu-tab {
        width: 26px;
        height: 44px;
        border-radius: 0 12px 12px 0;
        font-size: .95rem;
        opacity: .22;
      }

      .menu-tab:hover,
      .menu-tab:focus-visible,
      .menu-tab.open {
        opacity: 1;
      }

      #placeholder-title {
        font-size: 1rem;
      }
    }

    .toast {
      position: fixed;
      inset: 1.2rem 0 auto;
      z-index: 200;
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none
    }

    .toast__card {
      display: flex;
      gap: .9rem;
      align-items: center;
      padding: .8rem 1.5rem;
      border-radius: 1rem;
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 10%, var(--surface2)), var(--surface2));
      outline: 1px solid var(--line2);
      outline-offset: -1px;
      box-shadow: 0 20px 50px -20px #000c;
      pointer-events: auto;
      animation: t-in .3s ease-out;
      max-width: 30rem;
      font-family: 'Onest', sans-serif;
    }

    .toast__card.err {
      outline-color: color-mix(in srgb, #ef4444 45%, transparent)
    }

    .toast.out {
      animation: t-out .3s ease-in forwards
    }

    @keyframes t-in {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }

      to {
        opacity: 1
      }
    }

    @keyframes t-out {
      to {
        opacity: 0;
        transform: translateY(-10px)
      }
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <header class="header">
    <a href="/" class="logo">NotALMS</a>
  </header>

  <button class="menu-tab" id="menu-tab" aria-label="Открыть меню">
    <i class="ti ti-chevron-right"></i>
  </button>
  <div class="menu-overlay" id="menu-overlay"></div>

  <div class="container">
    <aside class="lessons-list" id="sidebar">
      <div class="sidebar-mobile-head">
        <span class="menu-title">Меню курса</span>
        <button class="close-sidebar" id="close-sidebar" aria-label="Закрыть меню">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Теория</div>
        <div id="lessons-container"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Практика</div>
        <div id="tests-container"></div>
      </div>
      <a href="/dash" class="back-to-menu"><i class="ti ti-arrow-left"></i> в меню</a>
    </aside>

    <main class="course-content" id="main-area">
      <h2 id="placeholder-title">Выберите урок или тест из меню</h2>
    </main>
  </div>

  <script>
    const API_BASE = document.querySelector('meta[name="api-base"]')?.content || `${location.protocol}//${location.hostname}:8443/v1`;
    const token = localStorage.getItem('token') || '';
    if (!token) location.href = '/login';
    const courseID = location.pathname.split('/').pop();
    let currentTaskId = null;
    let currentTaskDefId = null;
    let currentTaskTitle = '';
    let attemptCounter = 0;

    function getLoaderHtml(customClass = '') {
      return `
      <div class="loader-box ${customClass}">
        <svg class="loader-svg ${customClass === 'btn-loader' ? 'btn-loader' : ''}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/>
          <path d="M10.72,19.9a8,8,0,0,1-6.5-9.79A7.77,7.77,0,0,1,10.4,4.16a8,8,0,0,1,9.49,6.52A1.54,1.54,0,0,0,21.38,12h.13a1.37,1.37,0,0,0,1.38-1.54,11,11,0,1,0-12.7,12.39A1.54,1.54,0,0,0,12,21.34h0A1.47,1.47,0,0,0,10.72,19.9Z">
            <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12" repeatCount="indefinite"/>
          </path>
        </svg>
      </div>`;
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      try {
        const opts = { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_BASE + endpoint, opts);
        if (res.status === 401) { location.href = '/login'; return null; }
        return await res.json().catch(() => null);
      } catch (e) { console.error('network error', e); return null; }
    }

    let readLessons = new Set();
    let solvedTasks = new Set();
    let hintedTasks = new Set();
    let currentLessonId = null;
    let readSent = false;

    async function init() {
      const lContainer = document.getElementById('lessons-container');
      lContainer.innerHTML = getLoaderHtml();
      const lessons = await apiRequest(`/search_lessons/${courseID}`);
      lContainer.innerHTML = '';
      const [reads, solved] = await Promise.all([
        apiRequest(`/me/reads/${courseID}`),
        apiRequest('/me/solved')
      ]);
      readLessons = new Set(reads?.read || []);
      solvedTasks = new Set((solved?.solved || []).map(String));
      hintedTasks = new Set((solved?.hinted || []).map(String));
      if (lessons && Array.isArray(lessons)) renderSidebar(lessons);
    }

    function statusHtml(isRead, isSolved, isHinted) {
      if (isSolved) return `<span class="nav-status"><i class="ti ti-circle-check"></i></span>`;
      if (isHinted) return `<span class="nav-status hint"><i class="ti ti-bulb"></i></span>`;
      if (isRead) return `<span class="nav-status"><i class="ti ti-eye"></i></span>`;
      return '';
    }

    function renderSidebar(lessons) {
      const lContainer = document.getElementById('lessons-container');
      const tContainer = document.getElementById('tests-container');
      lContainer.innerHTML = '';
      tContainer.innerHTML = '';
      lessons.forEach(lesson => {
        if (lesson.type === 'theory' || !lesson.type) {
          const isRead = readLessons.has(lesson._id);
          const el = document.createElement('div');
          el.className = 'nav-item' + (isRead ? ' done' : '');
          el.dataset.lessonId = lesson._id;
          el.innerHTML = `<span class="nav-title">${lesson.title || 'без названия'}</span>${statusHtml(isRead, false, false)}`;
          el.onclick = () => { loadLesson(lesson); closeSidebar(); };
          lContainer.appendChild(el);
        }
        loadTasksForLesson(lesson._id, tContainer);
      });
    }

    async function loadTasksForLesson(lessonID, container) {
      const tasks = await apiRequest(`/gettasks/${lessonID}`);
      if (!tasks) return;
      tasks.forEach(task => {
        const isSolved = solvedTasks.has(String(task._id));
        const isHinted = hintedTasks.has(String(task._id));
        const el = document.createElement('div');
        el.className = 'nav-item' + (isSolved ? ' done' : (isHinted ? ' hinted' : ''));
        el.dataset.taskId = task._id;
        el.innerHTML = `<span class="nav-title">${task.title || 'Тест'}</span><span class="test-badge">${task.mode || 'N'}</span>${statusHtml(false, isSolved, isHinted)}`;
        el.onclick = () => { currentTaskTitle = task.title || ''; currentTaskDefId = task._id; loadTestInterface(task._id); closeSidebar(); };
        container.appendChild(el);
      });
    }

    function attachReadTracker(lessonId) {
      const main = document.getElementById('main-area');
      readSent = readLessons.has(lessonId);
      const markBtn = document.getElementById('mark-read-btn');
      if (markBtn) {
        markBtn.onclick = () => {
          if (readSent) return;
          readSent = true;
          readLessons.add(lessonId);
          apiRequest(`/lesson/read/${lessonId}`, 'POST');
          const item = document.querySelector(`.nav-item[data-lesson-id="${lessonId}"]`);
          if (item && !item.querySelector('.nav-status')) {
            item.classList.add('done');
            item.insertAdjacentHTML('beforeend', statusHtml(true, false, false));
          }
          markBtn.style.display = 'none';
        };
        markBtn.style.display = readSent ? 'none' : 'flex';
      }
      const onScroll = () => {
        if (readSent || !currentLessonId) return;
        const nearBottomContent = main.scrollTop + main.clientHeight >= main.scrollHeight - 60;
        const nearBottomWindow = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 80;
        if (nearBottomContent || nearBottomWindow) {
          readSent = true;
          readLessons.add(lessonId);
          apiRequest(`/lesson/read/${lessonId}`, 'POST');
          const item = document.querySelector(`.nav-item[data-lesson-id="${lessonId}"]`);
          if (item && !item.querySelector('.nav-status')) {
            item.classList.add('done');
            item.insertAdjacentHTML('beforeend', statusHtml(true, false, false));
          }
          if (markBtn) markBtn.style.display = 'none';
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      main.addEventListener('scroll', onScroll, { passive: true });
    }

    function safeUrl(u) {
      if (u === null || u === undefined) return '';
      let s = String(u).trim();
      if (!s) return '';
      if (s.indexOf('&amp;') !== -1 || s.indexOf('&quot;') !== -1 || s.indexOf('&#') !== -1) {
        const ta = document.createElement('textarea');
        ta.innerHTML = s;
        s = ta.value;
      }
      if (/^\s*javascript:/i.test(s)) return '';
      return s
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderImage(block) {
      let src = block.src || block.url || block.value || block.image || '';
      if (src && typeof src === 'object') {
        src = src.src || src.url || '';
      }
      const alt = block.alt || block.caption || block.title || '';
      if (!src) {
        return `<div class="lesson-warning">изображение не указано</div>`;
      }
      return `<img class="lesson-img" src="${safeUrl(src)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;lesson-warning&quot;>не удалось загрузить изображение: '+this.alt+'</div>')" />`;
    }

    function loadLesson(lesson) {
      const main = document.getElementById('main-area');
      currentLessonId = lesson._id;
      let contentHtml = '';
      if (Array.isArray(lesson.content)) {
        lesson.content.forEach(block => {
          switch (block.type) {
            case 'text':
              contentHtml += `<div class="lesson-text">${escapeHtml(block.value || '')}</div>`;
              break;
            case 'image':
              contentHtml += renderImage(block);
              break;
            case 'video':
              contentHtml += renderVideo(block);
              break;
            case 'list':
              if (Array.isArray(block.items)) {
                contentHtml += `<ul class="lesson-list">` + block.items.map(i => `<li>${escapeHtml(i)}</li>`).join('') + `</ul>`;
              }
              break;
            case 'code':
              contentHtml += `<pre style="background:#0b1220;padding:12px;border-radius:12px;overflow:auto"><code>${escapeHtml(block.value || '')}</code></pre>`;
              break;
            case 'warning':
              contentHtml += `<div class="lesson-warning">${escapeHtml(block.value || '')}</div>`;
              break;
            default:
              contentHtml += `<div class="lesson-text">${escapeHtml(JSON.stringify(block))}</div>`;
          }
        });
      } else {
        contentHtml += `<p class="lesson-text">нет контента</p>`;
      }
      main.innerHTML = `<div style="max-width:900px;margin:0 auto;" id="lesson-root">
      <div class="lesson-header" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <h1 style="margin:0;font-size:1.5rem;">${escapeHtml(lesson.title || '')}</h1>
        <button id="mark-read-btn" class="mark-read-btn" title="отметить урок прочитанным"><i class="ti ti-check"></i> прочитано</button>
      </div>
      ${contentHtml}
    </div>`;
      mountEmbedScripts(main);
      main.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'instant' });
      attachReadTracker(lesson._id);
    }

    async function loadTestInterface(taskId) {
      const main = document.getElementById('main-area');
      main.innerHTML = getLoaderHtml();
      main.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'instant' });
      const response = await apiRequest(`/getTest/${taskId}`);
      if (!response || response.error) {
        const locked = (response?.error || '').includes('сначала');
        main.innerHTML = `<div class="test-container"><div class="${locked ? 'locked-note' : ''}" style="text-align:${locked ? 'left' : 'center'};color:${locked ? 'inherit' : 'var(--error)'}">${locked ? '<i class="ti ti-lock"></i> ' : ''}${escapeHtml(response?.error || 'Не удалось загрузить')}</div></div>`;
        return;
      }
      const task = response;
      currentTaskId = task.task_id; attemptCounter = 0;
      const condition = task.condition || {};
      const topStrand = condition.top || condition.single_chain || '';
      const bottomStrand = condition.bottom || '';
      const instruction = condition.instruction || '';
      const hintUsed = task.hint_used || hintedTasks.has(String(currentTaskDefId));
      const solves = Number(task.solves || 0);
      const nextReward = Number(task.next_reward || 100);

      const rewardChip = hintUsed
        ? `<span class="reward-chip muted" title="Подсказка уже была открыта — очки за это задание не начисляются">
             <i class="ti ti-bulb"></i> без очков
           </span>`
        : `<span class="reward-chip" title="${solves > 0 ? 'Награда за следующее решение' : 'Награда за решение'}">
             <i class="ti ti-star"></i>
             <b>+${nextReward}</b>
             ${solves > 0 ? `<span class="reward-mult">×&nbsp;${solves + 1}</span>` : ''}
           </span>`;

      main.innerHTML = `
      <div class="test-container">
        <div class="task-card">
          <div class="task-head">
            <div>
              <span class="task-kicker">Задание</span>
              <h3 class="task-title">${escapeHtml(currentTaskTitle || 'Практика')}</h3>
            </div>
            <div class="task-head-right" id="task-head-right">
              ${rewardChip}
              <span class="task-id">ID ${escapeHtml(String(task.task_id))}</span>
              <button class="bulb-btn ${hintUsed ? 'used' : ''}" id="bulb-btn"
                title="${hintUsed ? 'Подсказка уже была открыта — очки не начислятся' : 'Показать ответ — очки не начислятся'}">
                <i class="ti ti-bulb"></i> ${hintUsed ? 'использована' : 'подсказка'}
              </button>
            </div>
          </div>
          <div class="task-body">
            <p class="task-instruction">${escapeHtml(instruction)}</p>
            <div class="dna-display">
              ${topStrand ? `<div class="strand">${formatStrand(topStrand)}</div>` : ''}
              ${bottomStrand ? `<div class="strand">${formatStrand(bottomStrand)}</div>` : ''}
            </div>
            <div class="input-area">
              <label class="field-label" for="user-input">Ваш ответ</label>
              <input type="text" id="user-input" class="dna-input" placeholder="5'-...-3'" autocomplete="off">
              <div id="feedback" class="feedback-msg"></div>
            </div>
          </div>
          <div class="task-foot">
            <span class="attempts" id="attempts">попыток: 0</span>
            <button class="submit-btn" id="submit-btn" onclick="submitAnswer()"><span>Проверить</span></button>
          </div>
        </div>
      </div>`;

      const bulb = document.getElementById('bulb-btn');
      if (bulb) bulb.onclick = () => openHintPopover(currentTaskId, hintUsed);
      updateAttempts();
    }

    function closeHintPopover() {
      const p = document.getElementById('hint-popover');
      if (p) p.remove();
      document.removeEventListener('click', outsideHintClick, true);
      document.removeEventListener('keydown', escHintPopover);
    }
    function outsideHintClick(e) {
      const p = document.getElementById('hint-popover');
      if (!p) return;
      if (!p.contains(e.target) && e.target.id !== 'bulb-btn' && !e.target.closest('#bulb-btn')) {
        closeHintPopover();
      }
    }
    function escHintPopover(e) { if (e.key === 'Escape') closeHintPopover(); }

    function openHintPopover(taskId, alreadyUsed) {
      const existing = document.getElementById('hint-popover');
      if (existing) { closeHintPopover(); return; }
      if (!taskId) { showToast('сначала открой задание', true); return; }

      const wrap = document.getElementById('task-head-right');
      if (!wrap) return;

      const pop = document.createElement('div');
      pop.className = 'hint-popover';
      pop.id = 'hint-popover';

      if (alreadyUsed) {
        pop.innerHTML = `
          <p class="hint-popover__title"><i class="ti ti-bulb"></i> Подсказка уже открывалась</p>
          <p class="hint-popover__text">По этому заданию очки больше не начисляются. Можно решать сколько угодно раз — засчитается как решение без очков.</p>
          <div class="hint-popover__actions">
            <button type="button" onclick="closeHintPopover()">Понятно</button>
          </div>`;
      } else {
        pop.innerHTML = `
          <p class="hint-popover__title"><i class="ti ti-bulb"></i> Показать ответ?</p>
          <p class="hint-popover__text">За это задание очков не начислят. Ответ подставится в поле — его можно просто проверить.</p>
          <div class="hint-popover__actions">
            <button type="button" onclick="closeHintPopover()">Отмена</button>
            <button type="button" class="primary" onclick="confirmHint('${taskId}')">Показать</button>
          </div>`;
      }
      wrap.appendChild(pop);

      setTimeout(() => {
        document.addEventListener('click', outsideHintClick, true);
        document.addEventListener('keydown', escHintPopover);
      }, 0);
    }

    async function confirmHint(taskId) {
      closeHintPopover();
      showToast('подсказка открывает ответ — очков за эту задачу не будет', true);
      const input = document.getElementById('user-input');
      if (!input) { showToast('получить подсказку не удалось', true); return; }
      input.placeholder = 'загрузка ответа...'; input.value = ''; input.disabled = true;
      const res = await apiRequest(`/solve_task/${taskId}`, 'GET');
      const fb = document.getElementById('feedback');
      if (res && res.solution) {
        input.value = res.solution; input.disabled = false;
        if (fb) {
          fb.className = 'feedback-msg';
          fb.textContent = 'ответ показан — очков за это задание не будет';
          fb.style.color = 'var(--warning)';
        }
        const bulb = document.getElementById('bulb-btn');
        if (bulb) {
          bulb.classList.remove('visible');
          bulb.classList.add('used');
          bulb.innerHTML = '<i class="ti ti-bulb"></i> использована';
          bulb.title = 'Подсказка уже была открыта — очки не начислятся';
        }
        hintedTasks.add(String(currentTaskDefId));
        const item = document.querySelector(`.nav-item[data-task-id="${currentTaskDefId}"]`);
        if (item) {
          item.classList.remove('done');
          item.classList.add('hinted');
          const old = item.querySelector('.nav-status'); if (old) old.remove();
          item.insertAdjacentHTML('beforeend', statusHtml(false, false, true));
        }
        const headRight = document.getElementById('task-head-right');
        const chip = headRight?.querySelector('.reward-chip');
        if (chip) {
          chip.classList.add('muted');
          chip.title = 'Подсказка уже была открыта — очки за это задание не начисляются';
          chip.innerHTML = '<i class="ti ti-bulb"></i> без очков';
        }
      } else {
        input.disabled = false; input.placeholder = "5'-...-3'";
        if (fb) {
          fb.className = 'feedback-msg error';
          fb.textContent = `подсказка недоступна: ${escapeHtml(res?.error || 'задача закрыта или id устарел')}`;
        }
      }
    }

    async function submitAnswer() {
      const input = document.getElementById('user-input'); if (!input) return;
      const feedback = document.getElementById('feedback'); if (!feedback) return;
      const btn = document.getElementById('submit-btn'); if (!btn) return;
      const userVal = input.value.trim().toUpperCase();
      if (!userVal) return;
      input.disabled = true; btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = getLoaderHtml('btn-loader');
      const res = await apiRequest('/check_answer', 'POST', { task_id: currentTaskId, user_input: userVal });
      btn.innerHTML = original;
      input.disabled = false;
      if (res && res.is_correct) {
        input.classList.remove('error'); input.classList.add('success');
        feedback.className = 'feedback-msg success';
        if (res.hint_used) {
          feedback.textContent = 'решено, но без очков — подсказка по этому заданию уже открывалась';
          input.disabled = true;
          btn.disabled = true;
        } else {
          feedback.textContent = `Верно! +${res.rating_awarded ?? 100} к рейтингу (${res.solve_count || 1}-е решение)`;
          input.disabled = true;
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-repeat"></i> решить ещё раз';
          btn.onclick = () => loadTestInterface(currentTaskDefId);
        }
        updateAttempts();
        if (res.rating_awarded && currentTaskDefId) {
          solvedTasks.add(String(currentTaskDefId));
          const item = document.querySelector(`.nav-item[data-task-id="${currentTaskDefId}"]`);
          if (item) {
            item.classList.add('done');
            const old = item.querySelector('.nav-status'); if (old) old.remove();
            item.insertAdjacentHTML('beforeend', statusHtml(false, true, false));
          }
        }
      } else {
        attemptCounter++; updateAttempts();
        btn.disabled = false; input.classList.add('error'); feedback.className = 'feedback-msg error';
        if (res && res.errors && res.errors.length) {
          feedback.innerHTML = res.errors.slice(0, 5).map(err => {
            const idx = (typeof err.index === 'number') ? (err.index + 1) : '?';
            const msg = err.msg ? escapeHtml(err.msg) : `ожидалось: ${escapeHtml(err.expected || '')}`;
            return `<div class="err-line">позиция ${idx}: ${msg}</div>`;
          }).join('');
        } else {
          feedback.textContent = 'Неверно, попробуйте ещё раз.';
        }
        setTimeout(() => input.classList.remove('error'), 500);
        if (attemptCounter >= 3) {
          const bulb = document.getElementById('bulb-btn');
          if (bulb && !bulb.classList.contains('used')) bulb.classList.add('visible');
        }
        input.focus();
      }
    }

    function updateAttempts() {
      const a = document.getElementById('attempts');
      if (a) a.textContent = `попыток: ${attemptCounter}`;
    }

    function escapeHtml(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }

    function videoEmbedUrl(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.replace(/^www\./, '');
        if (host === 'youtu.be')
          return `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
        if (host.endsWith('youtube.com')) {
          if (u.pathname.startsWith('/watch'))
            return `https://www.youtube.com/embed/${u.searchParams.get('v') || ''}`;
          if (u.pathname.startsWith('/shorts/'))
            return `https://www.youtube.com/embed/${u.pathname.split('/')[2]}`;
          if (u.pathname.startsWith('/embed/'))
            return url;
        }
        if (host.endsWith('vk.com') || host.endsWith('vkvideo.ru')) {
          const m = u.pathname.match(/\/video(-?\d+)_(\d+)/);
          if (m) return `https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}`;
        }
        if (host.endsWith('rutube.ru')) {
          const m = u.pathname.match(/\/video\/([a-z0-9]+)/i);
          if (m) return `https://rutube.ru/play/embed/${m[1]}`;
        }
        return null;
      } catch (e) { return null; }
    }
    function renderVideo(block) {
      if (block && block.embed) {
        if (block.embed_type === 'script') {
          return `<div class="lesson-video-embed" data-embed-script="${escapeHtml(block.embed)}"></div>`;
        }
        return `<div class="lesson-video"><iframe src="${safeUrl(block.embed)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
      }
      const url = block && (block.url || block.src);
      if (!url) return `<div class="lesson-warning">видео не указано</div>`;
      const embed = videoEmbedUrl(url);
      if (embed)
        return `<div class="lesson-video"><iframe src="${safeUrl(embed)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
      return `<video class="lesson-video-file" controls src="${safeUrl(url)}"></video>`;
    }
    function mountEmbedScripts(root) {
      root.querySelectorAll('.lesson-video-embed[data-embed-script]').forEach(box => {
        if (box.dataset.mounted) return;
        box.dataset.mounted = '1';
        const s = document.createElement('script');
        s.src = box.dataset.embedScript;
        box.appendChild(s);
      });
    }
    function formatStrand(str) { if (!str) return ''; let m = str.match(/5'-(.+?)-3'/i); let left = "5'", right = "3'", seq = ''; if (m) { seq = m[1]; } else { m = str.match(/3'-(.+?)-5'/i); if (m) { seq = m[1]; left = "3'"; right = "5'"; } else { seq = str; left = ''; right = ''; } } const parts = []; if (left) parts.push(`<span class="end">${escapeHtml(left)}</span>`); parts.push(`<span class="seq">${escapeHtml(seq)}</span>`); if (right) parts.push(`<span class="end">${escapeHtml(right)}</span>`); return parts.join('<span style="color:#6b7280"> - </span>'); }

    const menuTab = document.getElementById('menu-tab');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('menu-overlay');
    const closeBtn = document.getElementById('close-sidebar');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      menuTab.classList.add('open');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      menuTab.classList.remove('open');
    }
    function isMobile() { return window.innerWidth <= 800; }

    menuTab.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) closeSidebar();
      else openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
    window.addEventListener('resize', () => { if (!isMobile()) closeSidebar(); });

    (async () => {
      try {
        const r = await fetch(`${API_BASE}/search_user`, { headers: { 'Authorization': `Bearer ${token}` } });
        const u = await r.json();
        if (u && u.theme) { document.body.dataset.theme = u.theme; localStorage.setItem('theme', u.theme); }
        else if (localStorage.getItem('theme')) document.body.dataset.theme = localStorage.getItem('theme');
      } catch {
        if (localStorage.getItem('theme')) document.body.dataset.theme = localStorage.getItem('theme');
      }
    })();

    init();
  </script>
</body>

</html>
