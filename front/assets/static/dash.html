<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotALMS — Дашборд</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script src="/assets/static/toast.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #13213d;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #fbbf24;
            --line: rgba(255, 255, 255, .08);
            --line2: rgba(255, 255, 255, .14);
            --acc1: #818cf8;
            --r-btn: 18px;
        }

        [data-theme="emerald"] {
            --primary: #10b981;
            --bg: #08130e;
            --card: rgba(14, 50, 38, .85);
            --text: #dcfce7;
            --acc1: #34d399;
        }

        [data-theme="sunset"] {
            --primary: #f59e0b;
            --bg: #171009;
            --card: rgba(60, 42, 14, .85);
            --text: #fef3c7;
            --acc1: #fbbf24;
        }

        [data-theme="rose"] {
            --primary: #f43f5e;
            --bg: #170a12;
            --card: rgba(70, 16, 38, .85);
            --text: #ffe4e6;
            --acc1: #fb7185;
        }

        [data-theme="ocean"] {
            --primary: #0ea5e9;
            --bg: #071224;
            --card: rgba(13, 52, 94, .85);
            --text: #e0f2fe;
            --acc1: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Onest', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }

        /* ===== header ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            background: #0a0910;
            border-bottom: 1px solid var(--line);
        }

        .burger {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            color: var(--muted);
            transition: .2s;
        }

        .burger:hover {
            color: var(--text);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--acc1);
            text-decoration: none;
            margin-right: auto;
        }

        /* ============================================================
           LIQUID GLASS КНОПКИ
           Только контур + стекло, без свечения вниз. Крупное скругление.
           ============================================================ */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: .1px;
            cursor: pointer;
            padding: 11px 20px;
            border-radius: var(--r-btn);
            border: 1px solid var(--line2);
            color: var(--text);
            background: rgba(255, 255, 255, .04);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
            white-space: nowrap;
            text-decoration: none;
            overflow: hidden;
            transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
        }

        /* тонкий блик-градиент в верхней половине, как у liquid glass */
        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .09),
                    rgba(255, 255, 255, .02) 45%,
                    transparent 70%);
        }

        .btn>* {
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            border-color: color-mix(in srgb, var(--primary) 55%, var(--line2));
            background: rgba(255, 255, 255, .07);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            color: #fff;
            border-color: color-mix(in srgb, var(--primary) 60%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .btn-primary::before {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .btn-primary:hover {
            border-color: color-mix(in srgb, var(--primary) 80%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 42%, transparent),
                    color-mix(in srgb, var(--primary) 22%, transparent));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .btn-primary .arr {
            transition: transform .18s;
        }

        .btn-primary:hover .arr {
            transform: translateX(3px);
        }

        .btn-lg {
            padding: 14px 26px;
            font-size: 15.5px;
            border-radius: 20px;
        }

        /* чип логина в шапке — liquid glass primary */
        .user {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: .1px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: var(--r-btn);
            border: 1px solid color-mix(in srgb, var(--primary) 60%, transparent);
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
            overflow: hidden;
            transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
        }

        .user::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .user>* {
            position: relative;
            z-index: 1;
        }

        .user:hover {
            border-color: color-mix(in srgb, var(--primary) 80%, transparent);
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 42%, transparent),
                    color-mix(in srgb, var(--primary) 22%, transparent));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .user:active {
            transform: translateY(1px);
        }

        /* ===== burger menu ===== */
        .menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #0a0910;
            border-right: 1px solid var(--line);
            transition: .3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .menu.active {
            left: 0;
        }

        .menu-head {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            height: 56px;
            flex: 0 0 auto;
            margin: 0 -16px 8px;
            padding: 0 12px 0 16px;
            background: #0a0910;
            border-bottom: 1px solid var(--line);
        }

        .menu-head h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .menu-close {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--muted);
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: .18s;
        }

        .menu-close:hover {
            background: rgba(255, 255, 255, .08);
            color: var(--text);
            border-color: var(--line2);
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: .95rem;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            transition: .18s;
        }

        .menu-item i {
            font-size: 1.15rem;
            color: var(--primary);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .menu-item>* {
            position: relative;
            z-index: 1;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, .05);
            color: var(--text);
        }

        .menu-item.active {
            border-color: color-mix(in srgb, var(--primary) 60%, transparent);
            color: #fff;
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--primary) 32%, transparent),
                    color-mix(in srgb, var(--primary) 18%, transparent));
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .menu-item.active::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .04) 45%,
                    transparent 70%);
        }

        .menu-item.active i {
            color: #fff;
        }

        .menu-item.bottom {
            margin-top: auto;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 25, .5);
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 90;
        }

        .menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== loader ===== */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: .3s;
        }

        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-svg {
            width: 60px;
            height: 60px;
            fill: var(--primary);
        }

        /* ===== page ===== */
        .page {
            max-width: 100rem;
            margin: 0 auto;
            padding: 2rem 1.2rem 3rem;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.4rem;
        }

        /* ===== news ===== */
        .announcements {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0 0;
        }

        .news-card {
            flex: 1;
            background: var(--card);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--line);
            display: flex;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--primary);
        }

        .news-emoji {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            flex-shrink: 0;
        }

        .news-title {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.05rem;
        }

        .news-desc {
            opacity: .9;
            margin-top: 4px;
            font-size: .92rem;
        }

        .arrow {
            font-size: 2.2rem;
            cursor: pointer;
            opacity: .6;
            user-select: none;
            transition: .2s;
        }

        .arrow:hover {
            opacity: 1;
        }

        /* ===== stats ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 25px 0 5px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            transition: .25s;
        }

        .stat:hover {
            transform: translateY(-3px);
            border-color: var(--line2);
        }

        .stat .num {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat .num.gold {
            color: var(--accent);
        }

        .stat .lbl {
            font-size: .78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .stat .lbl .ti {
            margin-right: 4px;
        }

        /* ===== sections ===== */
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
        }

        .section-head h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0;
        }

        /* ===== courses ===== */
        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .course {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: .25s;
        }

        .course:hover {
            transform: translateY(-4px);
            border-color: var(--line2);
            box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .7);
        }

        .course h3 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .course-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: .72rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: color-mix(in srgb, var(--primary) 15%, transparent);
            border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
            color: var(--primary);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 600;
        }

        .badge.easy {
            background: rgba(52, 211, 153, .12);
            border-color: rgba(52, 211, 153, .4);
            color: #6ee7b7;
        }

        .badge.hard {
            background: rgba(248, 113, 113, .12);
            border-color: rgba(248, 113, 113, .4);
            color: #fca5a5;
        }

        .course-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .course-tag {
            font-size: .75rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
        }

        .course-empty {
            text-align: center;
            color: #64748b;
            padding: 40px 0;
            grid-column: 1 / -1;
        }

        /* ===== leaderboard ===== */
        .leaderboard {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 18px;
            transition: .25s;
        }

        .lb-row:hover {
            border-color: var(--line2);
        }

        .lb-row.me {
            border-color: color-mix(in srgb, var(--primary) 40%, transparent);
            background: color-mix(in srgb, var(--primary) 6%, var(--card));
        }

        .lb-pos {
            font-weight: 800;
            color: var(--primary);
            min-width: 32px;
            text-align: center;
        }

        .lb-name {
            flex: 1;
            font-weight: 600;
        }

        .lb-score {
            color: var(--accent);
            font-weight: 600;
        }

        .lb-empty {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== mobile ===== */
        @media (max-width: 700px) {
            .header {
                padding: 12px 14px;
            }

            .logo {
                font-size: 1.15rem;
            }

            .burger {
                font-size: 1.55rem;
            }

            .user {
                padding: .55rem .95rem;
                font-size: .85rem;
            }

            .page {
                padding: 1.4rem .9rem 2.4rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .menu {
                width: 260px;
                padding: 0 14px 14px;
            }

            .menu-head {
                margin: 0 -14px 8px;
                padding: 0 10px 0 14px;
                height: 50px;
            }

            .menu-item {
                padding: 10px 11px;
                font-size: .9rem;
                border-radius: 12px;
            }

            .announcements {
                margin: 12px 0 0;
                gap: 8px;
            }

            .news-card {
                padding: 10px 12px;
                border-radius: 12px;
            }

            .news-emoji {
                width: 40px;
                height: 40px;
                font-size: 1.6rem;
                border-radius: 10px;
            }

            .news-title {
                font-size: .9rem;
            }

            .news-desc {
                font-size: .8rem;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .arrow {
                font-size: 1.5rem;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat {
                padding: 12px 14px;
            }

            .stat .num {
                font-size: 1.4rem;
            }

            .stat .lbl {
                font-size: .68rem;
            }

            .courses {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .course {
                padding: 14px;
            }

            .course h3 {
                font-size: .95rem;
            }

            .section-head h2 {
                font-size: 1.15rem;
            }

            .lb-row {
                padding: 10px 12px;
            }

            .lb-pos {
                min-width: 28px;
                font-size: .9rem;
            }

            .lb-name,
            .lb-score {
                font-size: .9rem;
            }

            .btn {
                padding: .55rem .9rem;
                font-size: .88rem;
                border-radius: 14px;
            }

            .btn-lg {
                padding: 12px 20px;
                font-size: .95rem;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- loader -->
    <div id="global-loader" class="loader-overlay">
        <svg class="loader-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25" />
            <path
                d="M10.72,19.9a8,8,0,0,1-6.5-9.79A7.77,7.77,0,0,1,10.4,4.16a8,8,0,0,1,9.49,6.52A1.54,1.54,0,0,0,21.38,12h.13a1.37,1.37,0,0,0,1.38-1.54,11,11,0,1,0-12.7,12.39A1.54,1.54,0,0,0,12,21.34h0A1.47,1.47,0,0,0,10.72,19.9Z">
                <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12"
                    repeatCount="indefinite" />
            </path>
        </svg>
    </div>

    <!-- burger menu -->
    <div class="menu" id="menu">
        <div class="menu-head">
            <h3>Меню</h3>
            <button class="menu-close" onclick="closeMenu()" aria-label="Закрыть меню">
                <i class="ti ti-x"></i>
            </button>
        </div>
        <button class="menu-item active" id="nav-courses" onclick="showSection('courses')">
            <i class="ti ti-books"></i><span>Курсы</span>
        </button>
        <button class="menu-item" id="nav-top" onclick="showSection('top')">
            <i class="ti ti-trophy"></i><span>Топ учеников</span>
        </button>
        <a class="menu-item" href="/profile"><i class="ti ti-user-circle"></i><span>Профиль</span></a>
        <a class="menu-item" href="/settings"><i class="ti ti-settings"></i><span>Настройки</span></a>
        <button class="menu-item bottom" onclick="logout()"><i class="ti ti-logout"></i><span>Выйти</span></button>
    </div>
    <div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>

    <!-- header -->
    <div class="header">
        <div class="burger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></div>
        <a href="/" class="logo">NotALMS</a>
        <a href="/profile" class="user" id="user-name"><span>...</span></a>
    </div>

    <!-- page -->
    <main class="page">
        <div class="title">Дашборд</div>

        <div class="announcements" id="announcements" style="display:none">
            <div class="arrow" id="newsPrev"><i class="ti ti-chevron-left"></i></div>
            <div class="news-card">
                <div class="news-emoji" id="newsEmoji">
                    <i class="ti ti-speakerphone" style="font-size:1.6rem;color:var(--acc1)"></i>
                </div>
                <div>
                    <div class="news-title" id="newsTitle"></div>
                    <div class="news-desc" id="newsText"></div>
                </div>
            </div>
            <div class="arrow" id="newsNext"><i class="ti ti-chevron-right"></i></div>
        </div>

        <div class="stats-row" id="stats-row">
            <div class="stat">
                <div class="num gold" id="st-rating">—</div>
                <div class="lbl"><i class="ti ti-star"></i> мой рейтинг</div>
            </div>
            <div class="stat">
                <div class="num" id="st-solved">—</div>
                <div class="lbl"><i class="ti ti-circle-check"></i> решено задач</div>
            </div>
            <div class="stat">
                <div class="num" id="st-place">—</div>
                <div class="lbl"><i class="ti ti-trophy"></i> место в топе</div>
            </div>
            <div class="stat">
                <div class="num" id="st-courses">—</div>
                <div class="lbl"><i class="ti ti-book"></i> курсов доступно</div>
            </div>
        </div>

        <div id="section-courses">
            <div class="section-head">
                <h2>Доступные курсы</h2>
            </div>
            <div id="courses" class="courses"></div>
        </div>

        <div id="section-top" style="display:none">
            <div class="section-head">
                <h2><i class="ti ti-trophy" style="color:var(--acc1)"></i> Топ учеников</h2>
            </div>
            <div id="leaderboard" class="leaderboard">
                <div class="lb-empty">загрузка...</div>
            </div>
        </div>
    </main>

    <script>
        const API = document.querySelector('meta[name="api-base"]')?.content || `${location.protocol}//${location.hostname}:8443/v1`;
        const token = localStorage.getItem('token');
        if (!token) location.href = '/';

        const loader = document.getElementById('global-loader');
        const coursesBox = document.getElementById('courses');

        let news = [], index = 0, timer = null;

        /* ===== menu ===== */
        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
            document.getElementById('menu-overlay').classList.toggle('active');
        }
        function closeMenu() {
            document.getElementById('menu').classList.remove('active');
            document.getElementById('menu-overlay').classList.remove('active');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

        function showSection(name) {
            const top = name === 'top';
            document.getElementById('section-courses').style.display = top ? 'none' : '';
            document.getElementById('section-top').style.display = top ? '' : 'none';
            document.getElementById('nav-courses').classList.toggle('active', !top);
            document.getElementById('nav-top').classList.toggle('active', top);
            closeMenu();
            window.scrollTo({ top: 0, behavior: 'instant' });
            if (top) loadLeaderboard();
        }

        function logout() {
            localStorage.removeItem('token');
            location.href = '/';
        }

        /* ===== api helper ===== */
        async function apiGet(url) {
            const r = await fetch(API + url, {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!r.ok) throw new Error();
            return r.json();
        }

        /* ===== news ===== */
        function escapeEmoji(s) {
            const d = document.createElement('div');
            d.textContent = String(s || '');
            return d.innerHTML;
        }

        function renderNews() {
            const n = news[index];
            const emojiEl = document.getElementById('newsEmoji');
            emojiEl.innerHTML = n.emoji
                ? escapeEmoji(n.emoji)
                : '<i class="ti ti-speakerphone" style="font-size:1.6rem;color:var(--acc1)"></i>';

            document.getElementById('newsTitle').innerHTML = n.title || '';
            document.getElementById('newsText').innerHTML = n.text || '';

            if (window.twemoji) twemoji.parse(document.querySelector('.news-card'), { folder: 'svg', ext: '.svg' });
        }

        function startAuto() {
            clearInterval(timer);
            timer = setInterval(() => {
                index = (index + 1) % news.length;
                renderNews();
            }, 30000);
        }

        async function loadNews() {
            try {
                const data = await apiGet('/lastnews');
                if (!Array.isArray(data) || !data.length) return;
                news = data;
                document.getElementById('announcements').style.display = 'flex';
                renderNews();
                startAuto();
            } catch { }
        }

        document.getElementById('newsPrev').onclick = () => {
            index = (index - 1 + news.length) % news.length;
            renderNews();
            startAuto();
        };
        document.getElementById('newsNext').onclick = () => {
            index = (index + 1) % news.length;
            renderNews();
            startAuto();
        };

        /* ===== courses ===== */
        async function loadCourses() {
            const list = await apiGet('/courses');
            coursesBox.innerHTML = '';
            if (!list || !list.length) {
                coursesBox.innerHTML = '<div class="course-empty">курсов пока нет — они появятся здесь</div>';
                return;
            }
            list.forEach(c => {
                const el = document.createElement('div');
                el.className = 'course';
                const diff = (c.difficulty || '').toLowerCase();
                const tags = Array.isArray(c.tags) && c.tags.length
                    ? `<div class="course-tags">${c.tags.map(t => `<span class="course-tag">${String(t)}</span>`).join('')}</div>`
                    : '';
                el.innerHTML = `
                    <div class="course-head">
                        <h3>${c.title}</h3>
                        ${diff ? `<span class="badge ${diff}">${diff}</span>` : ''}
                    </div>
                    <div>${c.description || 'Без описания'}</div>
                    ${tags}
                `;
                el.onclick = () => location.href = `/course/${c._id || c.id}`;
                coursesBox.appendChild(el);
            });
            if (window.twemoji) twemoji.parse(coursesBox, { folder: 'svg', ext: '.svg' });
            document.getElementById('st-courses').textContent = list.length;
        }

        /* ===== stats ===== */
        async function loadStats() {
            try {
                const p = await apiGet('/me/progress');
                document.getElementById('st-solved').textContent = p.solved ?? 0;
                document.getElementById('st-place').textContent = p.rating_position ? `#${p.rating_position}` : '—';
            } catch { }
            try {
                const me = await apiGet('/search_user');
                document.getElementById('st-rating').textContent = me.rating ?? 0;
                if (me.theme) {
                    document.body.dataset.theme = me.theme;
                    document.documentElement.dataset.theme = me.theme;
                    localStorage.setItem('theme', me.theme);
                }
                const chip = document.getElementById('user-name');
                if (chip) {
                    const label = chip.querySelector('span') || chip;
                    label.textContent = me.user_login || 'профиль';
                    if (me.name_color) chip.style.color = me.name_color;
                }
            } catch { }
        }

        /* ===== leaderboard ===== */
        async function loadLeaderboard() {
            const box = document.getElementById('leaderboard');
            try {
                const me = await apiGet('/me');
                const list = await apiGet('/rating/leaderboard');
                if (!list || !list.length) {
                    box.innerHTML = '<div class="lb-empty">пока никто не решил ни одной задачи — стань первым</div>';
                    return;
                }
                box.innerHTML = '';
                list.forEach((u, i) => {
                    const row = document.createElement('div');
                    row.className = 'lb-row' + (u.user_uid === me.user_uid ? ' me' : '');
                    const color = u.name_color ? ` style="color:${u.name_color}"` : '';
                    row.innerHTML = `
                        <div class="lb-pos">${i + 1}</div>
                        <div class="lb-name"${color}>${u.user_login}</div>
                        <div class="lb-score"><i class="ti ti-star"></i> ${u.rating ?? 0}</div>
                    `;
                    box.appendChild(row);
                });
            } catch {
                box.innerHTML = '<div class="lb-empty">не удалось загрузить топ</div>';
            }
        }

        /* ===== init ===== */
        (async () => {
            try {
                const me = await apiGet('/me');
                const chip = document.getElementById('user-name');
                if (chip) {
                    const label = chip.querySelector('span') || chip;
                    label.textContent = me.user_login;
                    if (me.name_color) chip.style.color = me.name_color;
                }
                if (me.theme) {
                    document.body.dataset.theme = me.theme;
                    document.documentElement.dataset.theme = me.theme;
                    localStorage.setItem('theme', me.theme);
                }

                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 300);

                await loadNews();
                await loadCourses();
                loadStats();
                loadLeaderboard();
            } catch (e) {
                loader.remove();
                document.querySelector('.page').innerHTML =
                    '<div style="text-align:center;color:#ef4444;margin-top:40px;font-size:1.2rem">Сессия истекла или ошибка сети</div>';
            }
        })();
    </script>
</body>

</html>
