<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NotALMS — вход по ссылке</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
:root{
  --acc1:#FF5099;--acc2:#FF2E2E;--bg:#08070b;--surface:#0e0d13;--surface2:#131019;
  --line:rgba(255,255,255,.055);--line2:rgba(255,255,255,.1);--text:#f4f4f5;--muted:rgba(255,255,255,.5);
  --grad:linear-gradient(90deg,var(--acc1),var(--acc2));--r:14px;
}
body[data-theme="emerald"]{--acc1:#34d399;--acc2:#0d9488;--bg:#06120c;--surface:#0b1813;--surface2:#0e1e17}
body[data-theme="sunset"]{--acc1:#fbbf24;--acc2:#f97316;--bg:#141008;--surface:#1b160c;--surface2:#221b0e}
body[data-theme="rose"]{--acc1:#fb7185;--acc2:#e11d48;--bg:#120a0f;--surface:#190d14;--surface2:#20111a}
body[data-theme="ocean"]{--acc1:#38bdf8;--acc2:#0284c7;--bg:#061019;--surface:#0a1626;--surface2:#0d1c30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Onest',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{
  width:100%;max-width:26rem;padding:2.6rem 2.2rem;border-radius:18px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc1) 7%,var(--surface)),var(--surface) 40%);
  outline:1px solid var(--line);outline-offset:-1px;
  box-shadow:0 20px 50px -20px #000c;
}
.logo{font-weight:800;font-size:1.5rem;margin-bottom:1.6rem}
.spin{width:44px;height:44px;border:3px solid var(--acc1);border-top-color:transparent;border-radius:50%;margin:0 auto 1.2rem;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{color:var(--muted);font-size:.98rem}
.err{display:none;color:#f87171;font-size:.95rem;line-height:1.6;margin-top:.4rem}
button{
  display:none;margin-top:1.4rem;padding:.85rem 1.7rem;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc1) 28%,transparent),color-mix(in srgb,var(--acc2) 14%,transparent));
  outline:1px solid var(--line);outline-offset:-1px;color:var(--text);font-family:inherit;font-size:1rem;transition:.2s;
}
button:hover{transform:scale(.97);filter:brightness(1.15)}

  @media(max-width: 480px) {
    body{padding:.5rem}
    .box{max-width:100%;padding:2rem 1.5rem;border-radius:14px}
    .logo{font-size:1.3rem;margin-bottom:1.2rem}
    .spin{width:36px;height:36px;border-width:2px;margin-bottom:1rem}
    .msg{font-size:.9rem}
    .err{font-size:.85rem}
    button{padding:.75rem 1.2rem;font-size:.95rem;border-radius:10px}
  }
</style>
</head>
<body>
<div class="box">
    <div class="logo gtext">NotALMS</div>
    <div class="spin"></div>
    <div class="msg" id="msg">вхожу по ссылке из telegram...</div>
    <div class="err" id="err">ссылка не сработала: истекла или уже использована.<br>попроси новую в боте — <b>/login</b></div>
    <button id="go" onclick="location.href='/'">на главную</button>
</div>
<script>

(async () => {
    const code = location.pathname.split('/').pop();
    const API = `${location.protocol}//${location.hostname}:8004/v1`;
    if (localStorage.getItem('theme')) document.body.dataset.theme = localStorage.getItem('theme');
    try {
        const res = await fetch(`${API}/login/telegram`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (res.ok && data.JWTSession) {
            localStorage.setItem('token', data.JWTSession);
            document.querySelector('.spin').style.display = 'none';
            document.getElementById('msg').innerHTML = '<i class="ti ti-check" style="color:var(--acc1);margin-right:.5rem"></i>вход выполнен, открываю дашборд...';
            setTimeout(() => location.href = '/dash', 600);
            return;
        }
        throw new Error();
    } catch (e) {
        document.querySelector('.spin').style.display = 'none';
        document.getElementById('msg').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        document.getElementById('go').style.display = 'inline-block';
    }
})();</script>
</body>
</html>
