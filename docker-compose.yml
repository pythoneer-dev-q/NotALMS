# ! docker-compose.yml
# внутренние порты контейнеров фиксированы (8004/8005), наружу публикуются BACK_PORT/FRONT_PORT_HOST
# https: серты из ./certs монтируются в /certs, в .env SSL_CERTFILE=/certs/cert.pem + SSL_KEYFILE=/certs/key.pem
# dev-фолбэк: DEV_CERTS=1 — entrypoint сам сгенерит self-signed, если сертов нет
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: &limited-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *limited-logs
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 16mb
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8004"
      WORKERS: ${WORKERS:-2}
      # в контейнере mongo/redis всегда по сети compose
      MONGO_URI: mongodb://mongo:27017/
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${BACK_PORT:-8004}:8004"
    volumes:
      - ./certs:/certs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      FRONT_HOST: 0.0.0.0
      FRONT_PORT: "8005"
      MONGO_URI: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${FRONT_PORT_HOST:-${FRONT_PORT:-8005}}:8005"
    volumes:
      - ./certs:/certs
    depends_on:
      - back

  bot:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379/0
    command: python -m back.auth.bot.main
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
